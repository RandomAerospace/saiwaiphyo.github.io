  h += `<button class="btn" type="button" data-act="starter">Reset to starter</button>`;
  h += `<button class="btn" type="button" data-act="sol">${S.solShown[ex.id] ? 'Hide solution' : 'Show solution'}</button>`;
  h += `</div>`;
  for (let i = 0; i < shown; i++) h += `<div class="hint"><b>Hint ${i + 1}.</b> ${esc(ex.hints[i])}</div>`;
  if (S.solShown[ex.id]) h += `<pre class="asm" data-nobtn="1">${esc(ex.solution)}</pre><p style="font-size:12.5px;color:var(--muted)">One possible answer. Others pass too. Retype it rather than paste it; your draft is unchanged.</p>`;
  const R = store.lastCheck[ex.id];
  if (R) {
    const nOk = R.rows.filter((r) => r.ok).length;
    h += `<div class="results"><div class="sum ${R.pass ? 'pass' : 'fail'}"><span>${R.pass ? 'All checks passed' : `${R.rows.length - nOk} of ${R.rows.length} checks failed`}</span>${R.pass && nextEx(ex) ? `<button class="btn" type="button" data-act="nextex">Next exercise →</button>` : ''}</div>`;
    R.rows.forEach((r, i) => {
      h += `<div class="row ${r.ok ? 'ok' : 'no'}"><span class="ic">${r.ok ? '✓' : '✗'}</span><span><span class="lab">${esc(r.label)}</span><div class="det">${esc(r.detail)}</div></span>${r.debug ? `<button class="btn" type="button" data-debug="${i}">Debug</button>` : '<span></span>'}</div>`;
    });
    h += `</div>`;
  }
  return h + `</div>`;
}
function nextEx(ex) { const i = allEx.indexOf(ex); return allEx[i + 1] || null; }
$('paneBody').addEventListener('click', (e) => {
  const o = e.target.closest('[data-open]');
  if (o) { const ex = allEx.find((x) => x.id === o.dataset.open); openExercise(ex); return; }
  const n = e.target.closest('[data-next]');
  if (n) { S.ui = +n.dataset.next; $('paneBody').scrollTop = 0; openExercise(LESSONS[S.ui].exercises[0], true); return; }
  const a = e.target.closest('[data-act]');
  if (a && S.ex) {
    const ex = S.ex;
    if (a.dataset.act === 'check') checkNow();
    else if (a.dataset.act === 'hint') { store.hints[ex.id] = Math.min((store.hints[ex.id] || 0) + 1, ex.hints.length); save(); renderPane(); }
    else if (a.dataset.act === 'starter') { setCode(ex.starter); store.drafts[ex.id] = ex.starter; save(); delete store.lastCheck[ex.id]; save(); assemble(); renderPane(); }
    else if (a.dataset.act === 'sol') { S.solShown[ex.id] = !S.solShown[ex.id]; if (S.solShown[ex.id] && !store.solSeen[ex.id]) { store.solSeen[ex.id] = Date.now(); save(); } renderPane(); }
    else if (a.dataset.act === 'nextex') { const nx = nextEx(ex); if (nx) { if (nx.ui !== S.ui) { S.ui = nx.ui; $('paneBody').scrollTop = 0; } openExercise(nx, true); } }
    return;
  }
  const d = e.target.closest('[data-debug]');
  if (d && S.ex && store.lastCheck[S.ex.id]) {
    const row = store.lastCheck[S.ex.id].rows[+d.dataset.debug];
    const c = row.debug;
    setArgs(c.args.map((x) => Array.isArray(x) ? x : (x >>> 0) > 0xFFFF && (x | 0) >= 0 ? hex(x) : (x | 0)));
    S.pendingMem = c.memLabels || null;
    assemble();
    setLower('trace');
    $('bStep').focus();
  }
});

function setCtx(kind, name) { $('ctxKind').textContent = kind; $('ctxName').textContent = name; $('ctxName').title = name; }
function openExercise(ex, keepScroll) {
  if (!ex) return;
  stopRun();
  saveDraftNow();
  S.ex = ex; S.ctx = 'exercise'; S.ui = ex.ui;
  loadBps();
  S.asmOpts = ex.opts || {};
  S.pendingMem = null; S.extraRegs = null;
  setArgs([]);
  setCode(store.drafts[ex.id] != null ? store.drafts[ex.id] : ex.starter);
  setCtx('Exercise ' + ex.num, ex.title);
  store.loc = { ex: ex.id }; save();
  S.paneTab = 'lesson';
  $('tabLesson').setAttribute('aria-selected', true); $('tabRef').setAttribute('aria-selected', false); $('tabProg').setAttribute('aria-selected', false);
  assemble();
  const st = $('paneBody').scrollTop;
  renderPane(); renderRail();
  if (keepScroll === true) $('paneBody').scrollTop = 0; else $('paneBody').scrollTop = st;
  const card = $('paneBody').querySelector('.ex.active');
  if (card && keepScroll !== true) { const r = card.getBoundingClientRect(), pr = $('paneBody').getBoundingClientRect(); if (r.top < pr.top || r.top > pr.bottom - 80) card.scrollIntoView({ block: 'start' }); }
}
function checkNow() {
  const ex = S.ex; if (!ex || S.ctx !== 'exercise') return;
  stopRun();
  const res = C.checkExercise(Object.assign({}, ex, { opts: Object.assign({}, ex.opts || {}, { memModel: store.memModel }) }), ta.value);
  store.lastCheck[ex.id] = { pass: res.pass, at: Date.now(), rows: res.rows.map((r) => ({ ok: r.ok, label: r.label, detail: r.detail, debug: r.debug || null })) };
  store.attempts[ex.id] = (store.attempts[ex.id] || 0) + 1;
  store.drafts[ex.id] = ta.value;
  if (res.pass && !store.done[ex.id]) store.done[ex.id] = Date.now();
  save(); writeNow();
  assemble();
  renderPane(); renderRail();
  const card = $('paneBody').querySelector('.ex.active .results');
  if (card) card.scrollIntoView({ block: 'nearest' });
}
function splitInit(s) { const out = []; let d = 0, cur = ''; for (const ch of s) { if (ch === '[') d++; if (ch === ']') d--; if (ch === ',' && !d) { out.push(cur); cur = ''; } else cur += ch; } if (cur.trim()) out.push(cur); return out; }
function loadExample(code, init, opts, k) {
  stopRun();
  saveDraftNow();
  const u = LESSONS[S.ui];
  S.ctx = 'example'; S.ex = null; loadBps();
  S.asmOpts = opts ? JSON.parse(opts) : {};
  S.pendingMem = null; S.extraRegs = null;
  const args = [];
  for (const part of splitInit(init)) {
    const m = /^\s*(R\d+)\s*=\s*(.+)$/.exec(part); if (!m) continue;
    const r = E.regNum(m[1]);
    if (r <= 3) args[r] = m[2].trim();
    else { S.extraRegs = S.extraRegs || {}; S.extraRegs[m[1]] = parseNum(m[2]); }
  }
  argEls.forEach((el, i) => { el.value = args[i] || ''; el.style.borderColor = ''; });
  setCode(code.replace(/\s+$/, '') + '\n');
  setCtx('Example', `Unit ${u.num}: ${u.title}`);
  assemble();
  renderPane();
}
const SANDBOX_DEFAULT = `    .syntax unified
    .thumb
    .global asm_func

@ Sandbox: anything in the EE2028 syllabus.
@ Call arguments come from the bar above (R0-R3).
    .equ SCALE, 3

asm_func:
    LDR  R1, =SCALE
    MUL  R0, R0, R1
    LDR  R2, =RESULT
    STR  R0, [R2]
    BX   LR

    .lcomm RESULT, 4
`;
function openSandbox() {
  stopRun();
  saveDraftNow();
  S.ctx = 'sandbox'; S.ex = null; S.asmOpts = {}; S.pendingMem = null; S.extraRegs = null; loadBps();
  store.loc = { sandbox: true, ui: S.ui }; save();
  setCode(store.sandbox || SANDBOX_DEFAULT);
  setCtx('Sandbox', 'your scratch file (saved in this browser)');
  if (!argEls.some((e) => e.value)) argEls[0].value = '14';
  assemble(); renderPane();
}
$('bSandbox').addEventListener('click', openSandbox);

/* ---------- progress dashboard + backup ---------- */
function nextUnpassed() {
  const cur = S.ex ? allEx.indexOf(S.ex) : -1;
  return allEx.slice(cur + 1).find((x) => !store.done[x.id]) || allEx.find((x) => !store.done[x.id]) || null;
}
function renderProgress() {
  const passed = allEx.filter((e) => store.done[e.id]).length;
  const unitsDone = LESSONS.filter((u) => u.exercises.every((e) => store.done[e.id])).length;
  const checks = Object.values(store.attempts).reduce((a, b) => a + b, 0);
  const hints = Object.values(store.hints).reduce((a, b) => a + b, 0);
  const sols = Object.keys(store.solSeen).length;
  const firstTry = allEx.filter((e) => store.done[e.id] && store.attempts[e.id] === 1 && !store.solSeen[e.id]).length;
  const nx = nextUnpassed();
  let h = `<div class="unit-kicker">Progress</div><h2>Your progress</h2>`;
  h += `<div class="stats">
    <div class="tile"><b>${passed}<small>/${allEx.length}</small></b><span>exercises passed</span></div>
    <div class="tile"><b>${unitsDone}<small>/${LESSONS.length}</small></b><span>units complete</span></div>
    <div class="tile"><b>${checks}</b><span>checks run</span></div>
    <div class="tile"><b>${firstTry}</b><span>passed first try, no solution</span></div>
    <div class="tile"><b>${hints}</b><span>hints opened</span></div>
    <div class="tile"><b>${sols}</b><span>solutions viewed</span></div>
  </div>`;
  h += `<p class="muted-line">Started ${fmtTime(store.started)} · last saved ${fmtTime(lastWrite || store.updated)}</p>`;
  if (nx) h += `<p><button class="btn primary" type="button" data-open="${nx.id}">Continue: ${nx.num} ${esc(nx.title)} →</button></p>`;
  else h += `<div class="note"><b>All ${allEx.length} exercises passed.</b> The sandbox is still there for your assignment drafts.</div>`;
  h += `<h3>By unit</h3><table class="ref prog"><tr><th>Unit</th><th>Exercises</th><th></th></tr>`;
  for (const u of LESSONS) {
    const d = u.exercises.filter((e) => store.done[e.id]).length;
    h += `<tr><td><button class="linkish" type="button" data-unit="${LESSONS.indexOf(u)}"><span class="mono">${u.num}</span> ${esc(u.title)}</button></td><td><div class="chips">`;
    for (const e of u.exercises) {
      const st = store.done[e.id] ? 'pass' : store.attempts[e.id] ? 'tried' : '';
      const tip = `${e.num} ${e.title} — ${st === 'pass' ? 'passed ' + fmtTime(store.done[e.id]) : st === 'tried' ? store.attempts[e.id] + ' check(s), not passed yet' : 'not started'}`;
      h += `<button class="chip ${st}" type="button" data-open="${e.id}" title="${esc(tip)}">${e.num}</button>`;
    }
    h += `</div></td><td class="mono cnt">${d}/${u.exercises.length}</td></tr>`;
  }
  h += `</table>`;
  h += `<h3>Backup and other devices</h3>
  <p>Passes, check results, hints, breakpoints and every code draft save automatically to this browser's storage as you work. They survive reloads and restarts. Clearing site data, private windows, or a different browser or device start empty, so export a backup to carry your progress across.</p>
  <div class="ex-actions">
    <button class="btn primary" type="button" data-bk="export">Download backup (.json)</button>
    <button class="btn" type="button" data-bk="copy">Copy backup as text</button>
    <label class="btn" for="importFile">Import from file…</label>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <button class="btn" type="button" data-bk="paste">Import from pasted text…</button>
  </div>
  <div id="pasteBox" hidden><textarea id="pasteArea" class="pastearea" spellcheck="false" placeholder="Paste a backup here"></textarea><div class="ex-actions"><button class="btn primary" type="button" data-bk="pastego">Import pasted backup</button></div></div>
  <p class="bk-msg" id="bkMsg" role="status"></p>
  <h3>Start over</h3>
  <p>Erases progress, drafts and results in this browser. Download a backup first if you might want it back.</p>
  <div class="ex-actions"><button class="btn danger" type="button" data-bk="reset">Erase all progress…</button></div>`;
  return h;
}
function backupPayload() { saveDraftNow(); return JSON.stringify({ app: 'ee2028-armv7em-workbench', schema: SCHEMA, exported: new Date().toISOString(), data: store }, null, 1); }
function bkMsg(txt, bad) { const el = $('bkMsg'); if (el) { el.textContent = txt; el.className = 'bk-msg' + (bad ? ' bad' : ' ok'); } }
function mergeIn(raw) {
  let inc;
  try { inc = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { throw new Error('That is not valid JSON.'); }
  if (inc && inc.data) inc = inc.data;
  if (!inc || typeof inc !== 'object' || !inc.done || typeof inc.done !== 'object') throw new Error('That does not look like a workbench backup (no "done" record).');
  inc = migrate(inc);
  let gained = 0;
  for (const [k, v] of Object.entries(inc.done)) if (allEx.some((e) => e.id === k)) { if (!store.done[k]) gained++; if (!store.done[k] || v < store.done[k]) store.done[k] = v; }
  for (const [k, v] of Object.entries(inc.attempts)) store.attempts[k] = Math.max(store.attempts[k] || 0, v | 0);
  for (const [k, v] of Object.entries(inc.hints)) store.hints[k] = Math.max(store.hints[k] || 0, v | 0);
  for (const [k, v] of Object.entries(inc.solSeen)) if (!store.solSeen[k]) store.solSeen[k] = v;
  for (const [k, v] of Object.entries(inc.lastCheck)) if (!store.lastCheck[k] || (v && v.at > store.lastCheck[k].at)) store.lastCheck[k] = v;
  for (const [k, v] of Object.entries(inc.bps)) if (!store.bps[k]) store.bps[k] = v;
  let drafts = 0;
  for (const [k, v] of Object.entries(inc.drafts)) {
    const ex = allEx.find((e) => e.id === k);
    if (typeof v === 'string' && (store.drafts[k] == null || (ex && store.drafts[k] === ex.starter))) { store.drafts[k] = v; drafts++; }
  }
  if (!store.sandbox && inc.sandbox) store.sandbox = inc.sandbox;
  store.started = Math.min(store.started || Date.now(), inc.started || Date.now());
  save(); writeNow();
  if (S.ctx === 'exercise' && S.ex && store.drafts[S.ex.id] != null && store.drafts[S.ex.id] !== ta.value) setCode(store.drafts[S.ex.id]);
  return { gained, drafts };
}
function doImport(text) {
  try { const r = mergeIn(text); renderRail(); renderPane(); bkMsg(`Imported: ${r.gained} newly passed exercise${r.gained === 1 ? '' : 's'}, ${r.drafts} draft${r.drafts === 1 ? '' : 's'} added. Existing progress was kept; nothing was overwritten.`); }
  catch (e) { bkMsg(e.message, true); }
}
let resetArmed = null;
$('paneBody').addEventListener('click', (e) => {
  const u = e.target.closest('[data-unit]');
  if (u) { S.ui = +u.dataset.unit; setPaneTab('lesson'); $('paneBody').scrollTop = 0; const ex = LESSONS[S.ui].exercises.find((x) => !store.done[x.id]) || LESSONS[S.ui].exercises[0]; openExercise(ex, true); return; }
  const b = e.target.closest('[data-bk]'); if (!b) return;
  const act = b.dataset.bk;
  if (act === 'export') {
    const blob = new Blob([backupPayload()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ee2028-progress-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    bkMsg('Backup downloaded. If nothing appeared, your browser blocked the download; use Copy instead.');
  } else if (act === 'copy') {
    const txt = backupPayload();
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => bkMsg(`Copied ${Math.round(txt.length / 1024)} KB to the clipboard. Paste it into a note or file to keep it.`), () => { $('pasteBox').hidden = false; $('pasteArea').value = txt; $('pasteArea').select(); bkMsg('Clipboard blocked. The backup is selected in the box; copy it by hand.', true); });
  } else if (act === 'paste') { $('pasteBox').hidden = !$('pasteBox').hidden; if (!$('pasteBox').hidden) $('pasteArea').focus(); }
  else if (act === 'pastego') doImport($('pasteArea').value);
  else if (act === 'reset') {
    if (resetArmed) {
      clearTimeout(resetArmed); resetArmed = null;
      const keep = { memModel: store.memModel, speed: store.speed };
      store = Object.assign(blank(), keep); storeDirty = true; writeNow();
      S.solShown = {}; S.bps = new Set();
      renderRail(); openExercise(allEx[0], true); setPaneTab('progress');
      bkMsg('All progress erased.');
    } else {
      b.textContent = 'Click again to erase everything';
      resetArmed = setTimeout(() => { resetArmed = null; b.textContent = 'Erase all progress…'; }, 4000);
    }
  }
});
$('paneBody').addEventListener('change', (e) => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  const f = e.target.files[0];
  f.text().then(doImport, () => bkMsg('Could not read that file.', true));
  e.target.value = '';
});

/* ---------- toolbar + keys ---------- */
$('bAsm').addEventListener('click', () => { assemble(); });
$('bStep').addEventListener('click', step);
$('bBack').addEventListener('click', back);
$('bRun').addEventListener('click', run);
$('speed').value = store.speed || '0';
$('speed').addEventListener('change', () => { store.speed = $('speed').value; save(); });
$('memModel').value = store.memModel;
$('memModel').addEventListener('change', () => { store.memModel = $('memModel').value; save(); assemble(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'F10') { e.preventDefault(); if (e.shiftKey) back(); else step(); }
  else if (e.key === 'F8') { e.preventDefault(); run(); }
  else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (S.ctx === 'exercise' && S.ex) checkNow(); else assemble(); }
});

/* ---------- boot ---------- */
renderRail();
renderSaveState();
const startEx = (store.loc && allEx.find((x) => x.id === store.loc.ex)) || allEx.find((x) => !store.done[x.id]) || allEx[0];
S.ui = startEx.ui;
if (store.loc && store.loc.sandbox) { S.ui = store.loc.ui || 0; renderPane(); openSandbox(); }
else openExercise(startEx, true);
})();
