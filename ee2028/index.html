<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMv7E-M Workbench</title>
<meta name="description" content="Interactive ARMv7E-M (Cortex-M4) assembly course and emulator for NUS EE2028, with step-by-step tracing and auto-checked exercises.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231F5FD1%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22monospace%22 font-size=%2214%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3EM4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Datasheet-style workbench: cool paper, cobalt accent, amber marks what just changed.
   Layout: unit rail | lesson pane | workbench (editor + machine state). */
:root {
  --bg: #EEF0F3;
  --panel: #FFFFFF;
  --sunk: #F6F7F9;
  --ink: #161A21;
  --muted: #5B6372;
  --faint: #8A919D;
  --line: #D8DCE2;
  --accent: #1F5FD1;
  --accent-soft: #E3ECFB;
  --hot: #C46A12;
  --hot-soft: #FCEBD8;
  --ok: #1B8551;
  --ok-soft: #DDF2E6;
  --bad: #C2372F;
  --bad-soft: #FBE3E1;
  --c-mn: #1F5FD1; --c-rg: #0B7783; --c-im: #9A4F00; --c-lb: #7438B0; --c-dr: #A62C63; --c-cm: #7D8592;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1116; --panel: #151920; --sunk: #11151B; --ink: #E5E8ED; --muted: #9AA2AF; --faint: #6D7582; --line: #262C36;
    --accent: #78A2FF; --accent-soft: #1A2740; --hot: #F2A65A; --hot-soft: #3A2814; --ok: #4CC38A; --ok-soft: #143023; --bad: #FF7A72; --bad-soft: #3A1816;
    --c-mn: #8FB2FF; --c-rg: #5CCAD3; --c-im: #E8AE6A; --c-lb: #C2A3F2; --c-dr: #F08DBB; --c-cm: #6F7886;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1116; --panel: #151920; --sunk: #11151B; --ink: #E5E8ED; --muted: #9AA2AF; --faint: #6D7582; --line: #262C36;
  --accent: #78A2FF; --accent-soft: #1A2740; --hot: #F2A65A; --hot-soft: #3A2814; --ok: #4CC38A; --ok-soft: #143023; --bad: #FF7A72; --bad-soft: #3A1816;
  --c-mn: #8FB2FF; --c-rg: #5CCAD3; --c-im: #E8AE6A; --c-lb: #C2A3F2; --c-dr: #F08DBB; --c-cm: #6F7886;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); display: flex; flex-direction: column; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
code, .mono { font-family: var(--f-mono); font-size: 0.92em; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 16px; padding: 0 16px; height: 48px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: 0.01em; white-space: nowrap; }
.brand small { font-family: var(--f-mono); font-weight: 500; font-size: 11px; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.progress { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; }
.progress:hover { border-color: var(--line); background: var(--sunk); }
.progress .bar { display: block; width: 120px; height: 6px; background: var(--sunk); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.top .spacer { flex: 1; }
.home { color: var(--muted); text-decoration: none; font-size: 16px; padding: 2px 6px; border-radius: 6px; }
.home:hover { background: var(--sunk); color: var(--ink); }
.savestate { font-size: 11.5px; color: var(--ok); white-space: nowrap; }
.savestate::before { content: "●"; margin-right: 5px; font-size: 9px; vertical-align: 1px; }
.savestate.bad { color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 4px 0 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--sunk); }
.tile b { display: block; font: 700 24px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.tile b small { font-size: 14px; color: var(--muted); font-weight: 600; }
.tile span { font-size: 11.5px; color: var(--muted); }
.muted-line { color: var(--muted); font-size: 12.5px; }
table.prog td { vertical-align: middle; }
table.prog td.cnt { color: var(--muted); text-align: right; white-space: nowrap; }
.linkish { background: none; border: 0; padding: 0; text-align: left; color: var(--ink); font-weight: 500; font-size: 12.5px; }
.linkish:hover { color: var(--accent); text-decoration: underline; }
.linkish .mono { color: var(--faint); margin-right: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 500 11px var(--f-mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--faint); }
.chip.pass { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); font-weight: 600; }
.chip.tried { background: var(--hot-soft); color: var(--hot); border-color: color-mix(in srgb, var(--hot) 40%, transparent); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.danger:hover { background: var(--bad-soft); }
label.btn { cursor: pointer; }
.pastearea { width: 100%; height: 120px; font: 11.5px var(--f-mono); border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--sunk); color: var(--ink); resize: vertical; }
.bk-msg { font-size: 12.5px; min-height: 1.2em; }
.bk-msg.ok { color: var(--ok); } .bk-msg.bad { color: var(--bad); }
.ex-meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 10px; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 12.5px; }

/* ---------- main grid ---------- */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 52px minmax(340px, 440px) 1fr; }
.rail { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 6px; display: flex; flex-direction: column; gap: 4px; }
.rail button { position: relative; border: 1px solid transparent; background: transparent; border-radius: 6px; height: 34px; font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--muted); padding: 0; }
.rail button:hover { background: var(--sunk); }
.rail button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.rail button .fill { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.rail button .fill i { display: block; height: 100%; background: var(--ok); }
.rail .sep { height: 1px; background: var(--line); margin: 4px 2px; }

.pane { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.pane-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); flex: none; }
.pane-tabs button { flex: 1; background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 10px 8px 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
.pane-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.pane-body { overflow-y: auto; padding: 18px 20px 40px; flex: 1; min-height: 0; }
.unit-kicker { font-family: var(--f-mono); font-size: 11.5px; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
.pane-body h2 { font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1.15; margin: 2px 0 14px; text-wrap: balance; }
.pane-body h3 { font-family: var(--f-display); font-weight: 600; font-size: 16.5px; margin: 22px 0 6px; }
.pane-body p { margin: 0 0 10px; }
.pane-body table.ref { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 6px 0 12px; }
.pane-body table.ref th, .pane-body table.ref td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.pane-body table.ref th { font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; background: var(--sunk); }
.pane-body table.ref code { white-space: nowrap; }
.note, .warn { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 0 6px 6px 0; margin: 10px 0 12px; font-size: 13px; }
.warn { border-left-color: var(--hot); background: var(--hot-soft); }
pre { margin: 0; }
.pane-body pre { font: 12.5px/1.55 var(--f-mono); background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 6px 0 12px; position: relative; tab-size: 8; }
.trio { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 8px 0 12px; }
.trio pre { margin: 0; padding-top: 24px; }
.trio pre::before { position: absolute; top: 5px; left: 12px; font: 600 10px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.trio pre.py::before { content: "Python"; }
.trio pre.c::before { content: "C"; }
.trio pre.asm::before { content: "ARMv7E-M"; color: var(--accent); }
.loadbtn { display: inline-flex; align-items: center; gap: 6px; margin: -6px 0 14px; font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); padding: 4px 10px; border-radius: 6px; }
.loadbtn:hover { background: color-mix(in srgb, var(--accent) 18%, var(--panel)); }
.t-mn { color: var(--c-mn); font-weight: 500; } .t-rg { color: var(--c-rg); } .t-im { color: var(--c-im); } .t-lb { color: var(--c-lb); }
.t-dr { color: var(--c-dr); } .t-cm { color: var(--c-cm); font-style: italic; } .t-sh { color: var(--c-mn); } .t-nu { color: var(--c-im); }

/* exercises in pane */
.ex-head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.ex-head h3 { margin: 0; }
.ex-list { display: flex; flex-direction: column; gap: 6px; }
.ex { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.ex > button.ex-title { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: transparent; border: 0; padding: 9px 12px; font-weight: 600; font-size: 13.5px; }
.ex .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; font-size: 11px; color: transparent; }
.ex.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.ex .exn { font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); font-weight: 500; }
.ex.active { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 0 3px var(--accent-soft); }
.ex-body { padding: 0 12px 12px; font-size: 13.5px; }
.ex-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 11px; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn:disabled { opacity: .45; cursor: default; }
.hint { background: var(--sunk); border: 1px dashed var(--line); padding: 6px 10px; border-radius: 6px; margin: 6px 0; font-size: 13px; }
.results { margin-top: 10px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.results .sum { padding: 7px 10px; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.results .sum.pass { background: var(--ok-soft); color: var(--ok); }
.results .sum.fail { background: var(--bad-soft); color: var(--bad); }
.results .row { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--line); font-size: 12.5px; align-items: start; }
.results .row .ic { font-weight: 700; }
.results .row.ok .ic { color: var(--ok); } .results .row.no .ic { color: var(--bad); }
.results .row .lab { font-family: var(--f-mono); font-size: 12px; word-break: break-word; }
.results .row .det { color: var(--muted); margin-top: 2px; font-family: var(--f-body); }
.results .row button { font-size: 11.5px; padding: 2px 8px; }

/* ---------- workbench ---------- */
.bench { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
.ctx { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-right: 6px; max-width: 280px; }
.ctx b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-group { display: inline-flex; gap: 4px; }
.tb-group .btn { padding: 5px 9px; }
.kbd { font-family: var(--f-mono); font-size: 10px; color: var(--faint); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
.btn.primary .kbd { color: #fff; border-color: rgba(255,255,255,.4); }
.callbar { display: flex; align-items: center; gap: 4px; font-family: var(--f-mono); font-size: 12.5px; flex-wrap: wrap; padding: 6px 12px; background: var(--sunk); border-bottom: 1px solid var(--line); flex: none; }
.callbar .fname { color: var(--c-lb); font-weight: 600; }
.callbar label { display: inline-flex; align-items: center; gap: 3px; color: var(--faint); font-size: 11px; }
.callbar input { width: 84px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 3px 6px; font-family: var(--f-mono); font-size: 12px; }
.callbar .hintx { color: var(--faint); font-family: var(--f-body); font-size: 11.5px; margin-left: 8px; }
.status { margin-left: auto; font-family: var(--f-body); font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.status.ready { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
.status.ret { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.status.fault, .status.err { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.status.run { color: var(--hot); background: var(--hot-soft); border-color: transparent; }

.wb { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 1fr) minmax(330px, 390px); }
.left { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
.editor { position: relative; flex: 1 1 58%; min-height: 200px; display: flex; background: var(--panel); overflow: hidden; }
.gutter { width: 48px; flex: none; background: var(--sunk); border-right: 1px solid var(--line); overflow: hidden; position: relative; user-select: none; }
.gutter .gin { position: absolute; top: 0; left: 0; right: 0; padding-top: 10px; }
.gutter .g { height: 20px; line-height: 20px; font: 11.5px/20px var(--f-mono); color: var(--faint); text-align: right; padding-right: 8px; position: relative; cursor: pointer; font-variant-numeric: tabular-nums; }
.gutter .g:hover { color: var(--ink); }
.gutter .g.bp::before { content: ""; position: absolute; left: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.gutter .g.er { color: var(--bad); font-weight: 600; }
.gutter .g.cur { color: var(--hot); font-weight: 600; }
.gutter .g.cur::after { content: "▶"; position: absolute; left: 16px; top: 0; font-size: 9px; color: var(--hot); }
.code { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.code pre.hl, .code textarea { font: 13px/20px var(--f-mono); tab-size: 8; padding: 10px 14px; margin: 0; white-space: pre; letter-spacing: 0; }
.code pre.hl { position: absolute; top: 0; left: 0; min-width: 100%; pointer-events: none; color: var(--ink); }
.code pre.hl > span { display: block; height: 20px; padding: 0 14px; margin: 0 -14px; }
.code pre.hl > span.cur { background: var(--hot-soft); box-shadow: inset 3px 0 0 var(--hot); }
.code pre.hl > span.er { background: var(--bad-soft); }
.code pre.hl > span.bpl { background: color-mix(in srgb, var(--bad) 7%, transparent); }
.code textarea { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: 0; outline: none; background: transparent; color: transparent; caret-color: var(--ink); overflow: auto; }
.code textarea::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); color: transparent; }

.lower { flex: 1 1 42%; min-height: 150px; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: var(--panel); }
.lower-tabs { display: flex; align-items: center; border-bottom: 1px solid var(--line); flex: none; padding-right: 8px; }
.lower-tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 7px 12px 5px; font-size: 12.5px; color: var(--muted); }
.lower-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.lower-tabs .cnt { font-family: var(--f-mono); font-size: 10.5px; background: var(--bad); color: #fff; border-radius: 8px; padding: 0 5px; margin-left: 4px; }
.lower-body { flex: 1; overflow-y: auto; min-height: 0; }
.now { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.now .where { font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); }
.now .ins { font-family: var(--f-mono); font-size: 14px; font-weight: 600; margin: 2px 0 6px; }
.now .exp { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; color: var(--ink); }
.now .exp .skip { color: var(--faint); }
.now.fault .exp { color: var(--bad); }
.now.idle { color: var(--muted); font-size: 13px; }
.hist { font-family: var(--f-mono); font-size: 11.5px; }
.hist div { padding: 3px 14px; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); display: grid; grid-template-columns: 44px 170px 1fr; gap: 8px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist div span { overflow: hidden; text-overflow: ellipsis; }
.hist div.sk { opacity: .55; }
.probs { padding: 6px 0; }
.probs div { padding: 5px 14px; font-size: 12.5px; display: grid; grid-template-columns: 64px 1fr; gap: 8px; cursor: pointer; }
.probs div:hover { background: var(--sunk); }
.probs .ln { font-family: var(--f-mono); color: var(--bad); font-weight: 600; }
.probs .w .ln { color: var(--hot); }
.probs .empty { color: var(--muted); cursor: default; display: block; }

/* state column */
.state { overflow-y: auto; background: var(--panel); min-height: 0; }
.sec { border-bottom: 1px solid var(--line); padding: 10px 12px; }
.sec h4 { margin: 0 0 6px; font: 600 11px var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.sec h4 .mini { text-transform: none; letter-spacing: 0; font-weight: 500; }
.regs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.reg { display: grid; grid-template-columns: 30px 1fr; gap: 4px; padding: 2px 5px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; align-items: baseline; }
.reg:hover { background: var(--sunk); }
.reg .n { color: var(--faint); font-weight: 600; }

<script>/* ARMv7E-M (Cortex-M4) teaching emulator, restricted to the EE2028 syllabus.
 * Course model: every instruction occupies one 4-byte word, PC reads as (address + 4).
 * Exposes EMU.assemble(src, opts) and EMU.Machine.
 */
(function (global) {
'use strict';

const U = (x) => x >>> 0;
const hex = (x, w = 8) => '0x' + (x >>> 0).toString(16).toUpperCase().padStart(w, '0');
const sdec = (x) => String(x | 0);

const EXIT_ADDR = 0x0807FFF0;          // stand-in for "return address inside C main()"
const RAM_SIZE = 0x18000;              // 96 KB SRAM1 (STM32L4)
const ARRAY_BASE = 0x20004000;         // where test harnesses place arrays passed by pointer

const REGNAMES = ['R0','R1','R2','R3','R4','R5','R6','R7','R8','R9','R10','R11','R12','SP','LR','PC'];

/* ---------- conditions ---------- */
const COND_LIST = ['EQ','NE','CS','HS','CC','LO','MI','PL','VS','VC','HI','LS','GE','LT','GT','LE','AL'];
const COND_INV = {EQ:'NE',NE:'EQ',CS:'CC',HS:'LO',CC:'CS',LO:'HS',MI:'PL',PL:'MI',VS:'VC',VC:'VS',HI:'LS',LS:'HI',GE:'LT',LT:'GE',GT:'LE',LE:'GT'};
const COND_DESC = {
  EQ:['Z==1','equal'], NE:['Z==0','not equal'],
  CS:['C==1','carry set / unsigned ≥'], HS:['C==1','unsigned ≥'],
  CC:['C==0','carry clear / unsigned <'], LO:['C==0','unsigned <'],
  MI:['N==1','negative'], PL:['N==0','positive or zero'],
  VS:['V==1','overflow'], VC:['V==0','no overflow'],
  HI:['C==1 && Z==0','unsigned >'], LS:['C==0 || Z==1','unsigned ≤'],
  GE:['N==V','signed ≥'], LT:['N!=V','signed <'],
  GT:['Z==0 && N==V','signed >'], LE:['Z==1 || N!=V','signed ≤'],
  AL:['always','always']
};
function condHolds(c, f) {
  switch (c) {
    case 'EQ': return f.Z === 1;
    case 'NE': return f.Z === 0;
    case 'CS': case 'HS': return f.C === 1;
    case 'CC': case 'LO': return f.C === 0;
    case 'MI': return f.N === 1;
    case 'PL': return f.N === 0;
    case 'VS': return f.V === 1;
    case 'VC': return f.V === 0;
    case 'HI': return f.C === 1 && f.Z === 0;
    case 'LS': return f.C === 0 || f.Z === 1;
    case 'GE': return f.N === f.V;
    case 'LT': return f.N !== f.V;
    case 'GT': return f.Z === 0 && f.N === f.V;
    case 'LE': return f.Z === 1 || f.N !== f.V;
    default: return true;
  }
}

/* ---------- the syllabus ---------- */
// cls: operand class; s: {S} suffix allowed
const OPS = {
  MOV:{cls:'mov',s:1}, MVN:{cls:'mov',s:1},
  ADD:{cls:'dp',s:1}, SUB:{cls:'dp',s:1},
  AND:{cls:'dp',s:1}, ORR:{cls:'dp',s:1}, EOR:{cls:'dp',s:1}, BIC:{cls:'dp',s:1}, ORN:{cls:'dp',s:1},
  CMP:{cls:'cmp'}, CMN:{cls:'cmp'}, TST:{cls:'cmp'}, TEQ:{cls:'cmp'},
  MUL:{cls:'mul',s:1}, MLA:{cls:'mla'}, MLS:{cls:'mla'},
  UMULL:{cls:'long'}, UMLAL:{cls:'long'}, SMULL:{cls:'long'}, SMLAL:{cls:'long'},
  SDIV:{cls:'div'}, UDIV:{cls:'div'},
  LSL:{cls:'shift',s:1}, LSR:{cls:'shift',s:1}, ASR:{cls:'shift',s:1}, ROR:{cls:'shift',s:1}, RRX:{cls:'rrx',s:1},
  LDR:{cls:'mem'}, STR:{cls:'mem'},
  B:{cls:'b'}, BL:{cls:'bl'}, BX:{cls:'bx'}, BLX:{cls:'bx'},
  PUSH:{cls:'stack'}, POP:{cls:'stack'}
};
const BASES = Object.keys(OPS).sort((a, b) => b.length - a.length);
const OUT_OF_SYLLABUS = new Set(['LDRB','LDRH','LDRSB','LDRSH','LDRD','STRB','STRH','STRD','LDM','LDMIA','LDMFD','LDMDB','STM','STMIA','STMDB','STMFD',
  'ADC','ADCS','SBC','SBCS','RSB','RSBS','CBZ','CBNZ','MOVW','MOVT','ADR','NOP','CLZ','REV','REV16','RBIT','UBFX','SBFX','BFI','BFC','NEG','NEGS',
  'SVC','BKPT','WFI','WFE','CPSID','CPSIE','MRS','MSR','TBB','TBH','SXTB','SXTH','UXTB','UXTH','SSAT','USAT','LDREX','STREX','DMB','DSB','ISB','SEV','VADD','VMOV','VLDR','VSTR','UMAAL','SMMUL','SMLABB','QADD','QSUB','SADD16','UADD8']);
const SYLLABUS_SUMMARY = 'MOV MVN ADD SUB MUL MLA MLS UMULL UMLAL SMULL SMLAL SDIV UDIV CMP CMN B BL BX BLX IT AND ORR EOR BIC ORN LSL LSR ASR ROR RRX TST TEQ LDR STR PUSH POP';
const BOILERPLATE = new Set(['.syntax','.cpu','.fpu','.thumb','.thumb_func','.global','.globl','.text','.section','.align','.balign','.p2align','.type','.size','.end','.ltorg','.arch']);

function splitMnemonic(word) {
  const W = word.toUpperCase();
  const it = /^IT([TE]{0,3})$/.exec(W);
  if (it) return [{ base: 'IT', mask: it[1], s: 0, cond: null }];
  const res = [];
  for (const base of BASES) {
    if (!W.startsWith(base)) continue;
    let rest = W.slice(base.length);
    let s = 0;
    const tryCond = (r, sflag) => {
      if (r === '') res.push({ base, s: sflag, cond: 'AL', explicitAL: false });
      else if (COND_LIST.includes(r)) res.push({ base, s: sflag, cond: r === 'HS' ? 'CS' : r === 'LO' ? 'CC' : r, condText: r, explicitAL: r === 'AL' });
    };
    tryCond(rest, 0);
    if (rest.startsWith('S')) tryCond(rest.slice(1), 1);
  }
  return res;
}

/* ---------- immediates ---------- */
function isModImm(v) {
  v = v >>> 0;
  if (v <= 0xFF) return true;
  const b = v & 0xFF;
  if (v === ((b << 16) | b) >>> 0) return true;
  if (v === (((b << 24) | (b << 8)) >>> 0)) return true;
  if (v === (((b << 24) | (b << 16) | (b << 8) | b) >>> 0)) return true;
  const B1 = (v >>> 8) & 0xFF;
  if (v === (((B1 << 24) | (B1 << 8)) >>> 0)) return true;
  // an 8-bit window anywhere (rotated constant)
  let tz = 0; while (((v >>> tz) & 1) === 0) tz++;
  return (v >>> tz) <= 0xFF;
}
function modImmIsRotated(v) {
  v = v >>> 0;
  if (v <= 0xFF) return false;
  const b = v & 0xFF, B1 = (v >>> 8) & 0xFF;
  if (v === (((b << 16) | b) >>> 0) || v === (((B1 << 24) | (B1 << 8)) >>> 0) || v === (((b << 24) | (b << 16) | (b << 8) | b) >>> 0)) return false;
  return true;
}

/* ---------- expressions ---------- */
function makeExprParser(str, resolve) {
  let i = 0;
  const s = str;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++; };
  function primary() {
    ws();
    if (s[i] === '(') { i++; const v = orx(); ws(); if (s[i] !== ')') throw new Error('missing ")" in expression "' + str + '"'); i++; return v; }
    if (s[i] === '-') { i++; return -primary(); }
    if (s[i] === '+') { i++; return primary(); }
    if (s[i] === '~') { i++; return ~primary(); }
    let m;
    const rest = s.slice(i);
    if ((m = /^0[xX][0-9a-fA-F]+/.exec(rest))) { i += m[0].length; return parseInt(m[0], 16); }
    if ((m = /^0[bB][01]+/.exec(rest))) { i += m[0].length; return parseInt(m[0].slice(2), 2); }
    if ((m = /^[0-9]+/.exec(rest))) { i += m[0].length; return parseInt(m[0], 10); }
    if ((m = /^'(.)'/.exec(rest))) { i += m[0].length; return m[1].charCodeAt(0); }
    if ((m = /^[A-Za-z_.$][\w.$]*/.exec(rest))) { i += m[0].length; return resolve(m[0]); }
    throw new Error('cannot read expression "' + str + '"');
  }
  function mul() { let v = primary(); for (;;) { ws(); if (s[i] === '*') { i++; v = v * primary(); } else if (s[i] === '/') { i++; const d = primary(); if (d === 0) throw new Error('division by zero in expression'); v = Math.trunc(v / d); } else return v; } }
  function add() { let v = mul(); for (;;) { ws(); if (s[i] === '+') { i++; v = v + mul(); } else if (s[i] === '-') { i++; v = v - mul(); } else return v; } }
  function sh() { let v = add(); for (;;) { ws(); if (s.startsWith('<<', i)) { i += 2; v = v << add(); } else if (s.startsWith('>>', i)) { i += 2; v = v >>> add(); } else return v; } }
  function andx() { let v = sh(); for (;;) { ws(); if (s[i] === '&') { i++; v = v & sh(); } else return v; } }
  function orx() { let v = andx(); for (;;) { ws(); if (s[i] === '|') { i++; v = v | andx(); } else if (s[i] === '^') { i++; v = v ^ andx(); } else return v; } }
  return () => { const v = orx(); ws(); if (i < s.length) throw new Error('unexpected "' + s.slice(i) + '" in expression'); return v; };
}

/* ---------- operand parsing ---------- */
function splitTop(str) {
  const out = []; let depth = 0, cur = '';
  for (const ch of str) {
    if (ch === '[' || ch === '{' || ch === '(') depth++;
    if (ch === ']' || ch === '}' || ch === ')') depth--;
    if (ch === ',' && depth === 0) { out.push(cur.trim()); cur = ''; } else cur += ch;
  }
  if (cur.trim() !== '' || out.length) out.push(cur.trim());
  return out;
}
function regNum(tok) {
  const t = tok.trim().toUpperCase();
  let m;
  if ((m = /^R(\d{1,2})$/.exec(t))) { const n = +m[1]; return n <= 15 ? n : -1; }
  if (t === 'SP') return 13; if (t === 'LR') return 14; if (t === 'PC') return 15;
  return -1;
}
function parseOperand(tok) {
  const t = tok.trim();
  let m;
  if (t === '') return { k: 'empty' };
  if (/^\{.*\}$/.test(t)) return { k: 'list', text: t.slice(1, -1) };
  if ((m = /^\[(.*)\]\s*(!?)$/.exec(t))) return { k: 'mem', inner: splitTop(m[1]), wb: m[2] === '!' };
  if (t[0] === '#') return { k: 'imm', expr: t.slice(1).trim() };
  if (t[0] === '=') return { k: 'lit', expr: t.slice(1).trim() };
  if ((m = /^(LSL|LSR|ASR|ROR)\s+(.+)$/i.exec(t))) return { k: 'shift', type: m[1].toUpperCase(), arg: m[2].trim() };

  if (r >= 0) return { k: 'reg', r };

}

/* ======================================================================
 * ASSEMBLER
 * ==================================================================== */
function assemble(src, opts = {}) {
  const o = Object.assign({ codeBase: 0x08000000, ramBase: 0x20000000, wordBase: null, memModel: 'lecture', spInit: 0x20008000 }, opts);
  const errors = [], warnings = [];
  const err = (line, msg) => errors.push({ line, msg });
  const warn = (line, msg) => warnings.push({ line, msg });

  // strip /* */ comments, keep line numbers
  let text = src.replace(/\r/g, '');
  text = text.replace(/\/\*[\s\S]*?\*\//g, (mm) => mm.replace(/[^\n]/g, ' '));
  const lines = text.split('\n');

  const labels = {};        // name -> {addr, kind, line}
  const equs = {};          // name -> {expr, line, value?, busy?}
  const items = [];         // instructions & words in order
  const lcomms = [];
  let loc = o.codeBase, wloc = o.wordBase != null ? o.wordBase : null, rloc = o.ramBase;
  let pending = [];
  let ended = false;

  function defineLabel(name, addr, kind, line) {
    if (labels[name] || equs[name]) { err(line, `"${name}" is defined twice`); return; }
    if (regNum(name) >= 0) { err(line, `"${name}" is a register name and cannot be a label`); return; }
    labels[name] = { addr, kind, line };
  }
  function flushPending(addr, kind) { for (const p of pending) defineLabel(p.name, addr, kind, p.line); pending = []; }

  for (let li = 0; li < lines.length && !ended; li++) {
    const lineNo = li + 1;
    let ln = lines[li];
    // comments: @ or ; (course convention); also // for convenience
    const ci = ln.search(/[@;]|\/\//);
    if (ci >= 0) ln = ln.slice(0, ci);
    ln = ln.trim();
    if (!ln) continue;
    let m;
    while ((m = /^([A-Za-z_.$][\w.$]*)\s*:\s*/.exec(ln))) { pending.push({ name: m[1], line: lineNo }); ln = ln.slice(m[0].length); }
    if (!ln) continue;
    if (ln[0] === '.') {
      const dm = /^(\.[A-Za-z_]+)\s*(.*)$/.exec(ln);
      const d = dm[1].toLowerCase(), args = dm[2];
      if (d === '.equ' || d === '.set') {
        const parts = splitTop(args);
        if (parts.length !== 2 || !/^[A-Za-z_.$][\w.$]*$/.test(parts[0])) { err(lineNo, `.equ needs "symbol, expression" — e.g. ".equ PI, 314"`); continue; }
        if (regNum(parts[0]) >= 0) { err(lineNo, `.equ cannot be applied to a register (${parts[0]}). Directives name constants/data, not registers.`); continue; }
        if (parts[1].trim().startsWith('#')) warn(lineNo, `no "#" is needed in .equ — directives take plain constants`);
        if (labels[parts[0]] || equs[parts[0]]) { err(lineNo, `"${parts[0]}" is defined twice`); continue; }
        equs[parts[0]] = { expr: parts[1].replace(/^#/, ''), line: lineNo };
        if (pending.length) { warn(lineNo, 'label before .equ ignored'); pending = []; }
      } else if (d === '.word') {
        const vals = splitTop(args);
        if (!args.trim() || vals.some((v) => v === '')) { err(lineNo, '.word needs one or more values, e.g. "NUM1: .word 123, 456"'); continue; }
        if (vals.some((v) => v.startsWith('#'))) warn(lineNo, 'no "#" is needed in .word — directives take plain constants');
        const base = wloc != null ? wloc : loc;
        flushPending(base, 'word');
        vals.forEach((v, k) => items.push({ kind: 'word', addr: base + 4 * k, expr: v.replace(/^#/, ''), line: lineNo }));
        if (wloc != null) wloc += 4 * vals.length; else loc += 4 * vals.length;
      } else if (d === '.lcomm') {
        const parts = splitTop(args);
        if (parts.length < 2 || !/^[A-Za-z_.$][\w.$]*$/.test(parts[0])) { err(lineNo, '.lcomm needs "NAME, bytes" — e.g. ".lcomm ANSWER, 4"'); continue; }
        let size;
        try { size = evalConst(parts[1].replace(/^#/, ''), lineNo, true); } catch (e) { err(lineNo, e.message); continue; }
        if (size <= 0) { err(lineNo, '.lcomm size must be positive'); continue; }
        rloc = (rloc + 3) & ~3;
        defineLabel(parts[0], rloc, 'lcomm', lineNo);
        lcomms.push({ name: parts[0], addr: rloc, size, line: lineNo });
        rloc += size;
        if (pending.length) { warn(lineNo, 'a label in front of .lcomm is ignored — .lcomm names its own symbol'); pending = []; }
      } else if (BOILERPLATE.has(d)) {
        if (d === '.end') ended = true;
        if (d === '.section' && args && !/^\.text/.test(args.trim())) warn(lineNo, `section "${args.trim()}" ignored — everything is placed as in .text`);
      } else if (['.byte', '.hword', '.short', '.space', '.skip', '.ascii', '.asciz', '.string', '.data', '.bss', '.org', '.fill', '.int', '.long', '.comm', '.quad'].includes(d)) {
        err(lineNo, `${d} is outside the EE2028 syllabus. Use .equ (constants), .word (initialised words) or .lcomm (uninitialised storage).`);
      } else {
        err(lineNo, `unknown directive ${d}`);
      }
      continue;
    }
    // instruction
    flushPending(loc, 'code');
    items.push({ kind: 'ins', addr: loc, text: ln, line: lineNo });
    loc += 4;
  }
  // trailing labels -> end of code
  flushPending(loc, 'code');

  const codeEnd = loc;
  const poolBase = (Math.max(loc, 0) + 3) & ~3;

  function evalConst(expr, line, constOnly) {
    const resolve = (name) => {
      if (equs[name]) {
        const e = equs[name];
        if (e.value !== undefined) return e.value;
        if (e.busy) throw new Error(`.equ "${name}" refers to itself`);
        e.busy = true;
        try { e.value = makeExprParser(e.expr, resolve)(); } finally { e.busy = false; }
        return e.value;
      }
      if (labels[name]) { if (constOnly) throw new Error(`"${name}" is an address — a constant is needed here`); return labels[name].addr; }
      if (regNum(name) >= 0) throw new Error(`register ${name} used where a constant is expected`);
      throw new Error(`undefined symbol "${name}"`);
    };
    return makeExprParser(expr, resolve)();
  }

  // memory image
  const mem = new Map();
  const w32 = (a, v) => { for (let k = 0; k < 4; k++) mem.set(a + k, (v >>> (8 * k)) & 0xFF); };

  const instrs = [];
  const byAddr = new Map();
  const literals = [];      // {key, value, addr, desc}
  const fakeWord = new Map();

  for (const it of items) {
    if (it.kind === 'word') {
      try { it.value = evalConst(it.expr, it.line) >>> 0; w32(it.addr, it.value); }
      catch (e) { err(it.line, e.message); }
    }
  }

  const ctx = { o, labels, equs, evalConst, err, warn, literals, poolBase };
  let idx = 0;
  for (const it of items) {
    if (it.kind !== 'ins') continue;
    const ins = decode(it, ctx);
    ins.idx = idx++;
    ins.word = (0xC0DE0000 + ins.idx) >>> 0;   // synthetic instruction word (emulator model)
    fakeWord.set(ins.word, ins);
    instrs.push(ins);
    byAddr.set(ins.addr, ins);
    w32(ins.addr, ins.word);
  }
  for (const L of literals) w32(L.addr, L.value);
  const poolEnd = poolBase + 4 * literals.length;

  // literal pool range check
  for (const ins of instrs) {
    if (ins.mem && ins.mem.mode === 'lit') {
      const pc = (ins.addr + 4) & ~3;
      const off = ins.mem.lit.addr - pc;
      ins.mem.off = off;
      if (off > 4095 || off < -4095) err(ins.line, 'literal pool is out of PC-relative range (±4095)');
    }
  }

  // IT block static checks
  for (let k = 0; k < instrs.length; k++) {
    const ins = instrs[k];
    if (ins.base === 'IT' && ins.ok) {
      const conds = ins.it.conds;
      for (let j = 0; j < conds.length; j++) {
        const t = instrs[k + 1 + j];
        if (!t) { err(ins.line, `IT block expects ${conds.length} instruction(s) after it`); break; }
        t.inIT = { pos: j, len: conds.length, head: ins };
        if (t.base === 'IT') { err(t.line, 'IT instruction cannot be inside another IT block'); continue; }
        if (t.cond !== conds[j]) err(t.line, `instruction ${j + 1} of the IT block must carry the ${conds[j]} suffix (e.g. ${t.base}${t.s ? 'S' : ''}${conds[j]}) — got ${t.cond === 'AL' ? 'no suffix' : t.cond}`);
        if ((t.isBranch) && j !== conds.length - 1) err(t.line, 'a branch inside an IT block must be the last instruction of the block');
        if (j > 0 && Object.values(labels).some((L) => L.kind === 'code' && L.addr === t.addr)) warn(t.line, 'label inside an IT block: branching here from outside skips the IT and is UNPREDICTABLE on hardware');
      }
    }
  }
  for (const ins of instrs) {
    if (!ins.ok || ins.base === 'IT') continue;
    if (ins.cond !== 'AL' && !ins.inIT && ins.base !== 'B') {
      err(ins.line, `${ins.mnemText} is conditional but not inside an IT block. In Thumb-2 only B{cond} may be conditional on its own — add "IT ${ins.condText}" before it.`);
    }
    if (ins.cond === 'AL' && ins.explicitAL && !ins.inIT) {/* fine */}
  }

  // regions
  const regions = [];
  regions.push({ name: o.wordBase != null ? 'code' : 'code + .word', start: o.codeBase, end: Math.max(poolEnd, o.codeBase + 4), flash: true });
  if (o.wordBase != null) regions.push({ name: '.word data', start: o.wordBase, end: Math.max(wloc, o.wordBase + 4), flash: true });
  regions.push({ name: 'SRAM', start: o.ramBase, end: o.ramBase + RAM_SIZE, flash: false });

  const entryName = labels.asm_func ? 'asm_func' : labels.main ? 'main' : null;
  const entry = entryName ? labels[entryName].addr : (instrs[0] ? instrs[0].addr : o.codeBase);
  if (entryName && labels[entryName].kind !== 'code') err(labels[entryName].line, `${entryName} must label an instruction`);

  const symbolsByAddr = {};
  for (const [n, L] of Object.entries(labels)) (symbolsByAddr[L.addr] = symbolsByAddr[L.addr] || []).push(n);

  const equValues = {};
  for (const n of Object.keys(equs)) { try { equValues[n] = evalConst(n, equs[n].line); } catch (e) { /* reported where used */ } }

  return {
    ok: errors.length === 0, errors: errors.sort((a, b) => a.line - b.line), warnings: warnings.sort((a, b) => a.line - b.line), instrs, byAddr, labels, equs: equValues, lcomms, literals,
    mem, regions, entry, entryName, codeEnd, poolBase, poolEnd, opts: o, fakeWord, symbolsByAddr,
    words: items.filter((i) => i.kind === 'word'), lineCount: lines.length, src
  };
}

/* ---------- instruction decode / validation ---------- */
function decode(it, ctx) {
  const { err, warn } = ctx;
  const line = it.line;
  const ins = { addr: it.addr, line, text: it.text, ok: false, cond: 'AL', s: 0 };
  const m = /^([A-Za-z.]+)\s*(.*)$/.exec(it.text);
  if (!m) { err(line, `cannot read "${it.text}"`); return ins; }
  const mword = m[1], operandText = m[2].trim();
  ins.mnemText = mword.toUpperCase();
  if (mword.includes('.')) { err(line, `width suffixes like "${mword}" are outside the syllabus — write ${mword.split('.')[0].toUpperCase()}`); return ins; }
  const cands = splitMnemonic(mword);
  const fail = (msg) => { err(line, msg); return ins; };
  if (!cands.length) {
    const W = mword.toUpperCase();
    const stripped = W.replace(/(EQ|NE|CS|HS|CC|LO|MI|PL|VS|VC|HI|LS|GE|LT|GT|LE|AL)$/, '').replace(/S$/, '');
    if (OUT_OF_SYLLABUS.has(W) || OUT_OF_SYLLABUS.has(stripped)) return fail(`${W} is a real Cortex-M4 instruction but is outside the EE2028 syllabus this tool is restricted to.`);
    const sOnly = BASES.find((b) => W.startsWith(b) && /^S/.test(W.slice(b.length)));
    if (sOnly && !OPS[sOnly].s) return fail(`${sOnly} has no S suffix form (${W})${sOnly === 'MLA' || sOnly === 'MLS' ? ' — on Cortex-M4 MLA/MLS never update the flags' : sOnly === 'SDIV' || sOnly === 'UDIV' ? ' — division never updates the flags' : ''}.`);
    return fail(`unknown mnemonic "${W}". Syllabus instructions: ${SYLLABUS_SUMMARY}`);
  }
  // prefer a candidate that is valid; for B vs BL ambiguity (e.g. BLS, BLT, BLE) the splitter already filtered
  const c = cands.find((x) => x.base !== 'IT' && !(x.s && !OPS[x.base].s)) || cands[0];
  if (c.base !== 'IT' && c.s && !OPS[c.base].s) {
    return fail(`${c.base} has no S suffix form${c.base === 'MLA' || c.base === 'MLS' ? ' — on Cortex-M4 MLA/MLS never update the flags (some summaries list MLA{S}; the M4 has no such encoding)' : c.base.endsWith('DIV') ? ' — division never updates the flags' : ''}.`);
  }

  ins.origBase = c.base;
  ins.condText = c.condText || c.cond;
  const ops = operandText === '' ? [] : splitTop(operandText).map(parseOperand);
  for (const op of ops) if (op.k === 'badreg') return fail(`"${op.text}" is not a register (R0–R15, SP, LR, PC)`);

  const evalImm = (expr) => {
    try { return ctx.evalConst(expr, line); } catch (e) { err(line, e.message); return null; }
  };
  const needReg = (op, what) => {
    if (!op || op.k !== 'reg') {
      if (op && op.k === 'sym' && /^-?(0x)?[0-9a-f]+$/i.test(op.expr)) { err(line, `${what}: immediates need a "#" — write #${op.expr}`); return null; }
      err(line, `${what}: expected a register`); return null;
    }

  };
  const noPC = (r, what) => { if (r === 15) { err(line, `PC cannot be used as ${what} here`); return false; } return true; };
  const noSPPC = (r, what) => { if (r === 13 || r === 15) { err(line, `${REGNAMES[r]} cannot be used as ${what} in ${ins.base}`); return false; } return true; };
  const nOps = (n, form) => { if (ops.length !== n) { err(line, `${ins.base} takes ${form}`); return false; } return true; };

  // Operand2 parser: ops slice
  const parseOp2 = (list, allowWide) => {
    if (list.length === 1 && list[0].k === 'imm') {
      const v = evalImm(list[0].expr); if (v === null) return null;
      return { type: 'imm', raw: v, value: v >>> 0 };
    }
    if (list.length === 1 && list[0].k === 'sym') {
      if (/^-?(0x)?[0-9a-f]+$/i.test(list[0].expr) || ctx.equs[list[0].expr]) { err(line, `immediates need a "#" — write #${list[0].expr}`); return null; }
      err(line, `"${list[0].expr}" is not a register or #immediate. To get a label's address use LDR Rd, =${list[0].expr}; to get the value stored there use LDR Rd, ${list[0].expr}`); return null;
    }
    if (list[0] && list[0].k === 'lit') { err(line, `"=${list[0].expr}" is only valid with LDR (pseudo-instruction): LDR Rd, =${list[0].expr}`); return null; }
    if (list[0] && list[0].k === 'reg') {
      const rm = list[0].r;
      if (list.length === 1) return { type: 'reg', rm, sh: null };
      if (list.length === 2 && list[1].k === 'shift') {
        const sh = list[1];
        if (sh.type === 'RRX') return { type: 'reg', rm, sh: { type: 'RRX', amt: 1 } };
        if (!sh.arg.startsWith('#')) { err(line, `register-controlled shifts are not allowed inside Operand2 on Thumb-2 — do "${sh.type} Rtmp, Rm, Rs" first`); return null; }
        const a = evalImm(sh.arg.slice(1)); if (a === null) return null;
        const lim = { LSL: [0, 31], LSR: [1, 32], ASR: [1, 32], ROR: [1, 31] }[sh.type];
        if (a < lim[0] || a > lim[1]) { err(line, `${sh.type} shift amount must be #${lim[0]}–#${lim[1]}`); return null; }
        return { type: 'reg', rm, sh: { type: sh.type, amt: a } };
      }
    }
    err(line, 'Operand2 must be #imm, Rm, or Rm with a shift (e.g. R2, LSL #4)'); return null;
  };

  // immediate fitting with GNU-as style substitutions
  const fitImm = (op2) => {
    const v = op2.value, raw = op2.raw;
    const b = ins.base;
    const okMod = isModImm(v);
    if (b === 'MOV') {
      if (okMod) return true;
      if (!ins.s && v <= 0xFFFF) { op2.wide = 16; return true; }
      if (isModImm(~v)) { ins.base = 'MVN'; op2.value = (~v) >>> 0; ins.note = `assembler encodes as MVN${ins.s ? 'S' : ''} ${REGNAMES[ins.rd]}, #${op2.value}`; return true; }
      err(line, `#${raw} (${hex(v)}) cannot be encoded as a MOV immediate. MOV takes 0–65535 (or an 8-bit pattern); for 17- to 32-bit values use the pseudo-instruction LDR ${REGNAMES[ins.rd]}, =${raw}`); return false;
    }
    if (b === 'MVN') {
      if (okMod) return true;
      if (isModImm(~v)) { ins.base = 'MOV'; op2.value = (~v) >>> 0; ins.note = `assembler encodes as MOV ${REGNAMES[ins.rd]}, #${op2.value}`; return true; }
    }
    if (b === 'ADD' || b === 'SUB') {
      if (okMod) return true;
      if (!ins.s && v <= 4095) { op2.wide = 12; return true; }
      const n = (-v) >>> 0;
      if ((raw < 0 || v > 0x7FFFFFFF) && (isModImm(n) || (!ins.s && n <= 4095))) { ins.base = b === 'ADD' ? 'SUB' : 'ADD'; op2.value = n; if (!isModImm(n)) op2.wide = 12; ins.note = `assembler encodes as ${ins.base}${ins.s ? 'S' : ''} with #${n}`; return true; }
      err(line, `#${raw} cannot be encoded for ${b}${ins.s ? 'S' : ''} (${b} takes #imm12 0–4095 without S, or an 8-bit pattern). Load it first: LDR Rx, =${raw}`); return false;
    }
    if (b === 'CMP' || b === 'CMN') {
      if (okMod) return true;
      const n = (-v) >>> 0;
      if (isModImm(n)) { ins.base = b === 'CMP' ? 'CMN' : 'CMP'; op2.value = n; ins.note = `assembler encodes as ${ins.base} ${REGNAMES[ins.rn]}, #${n}`; return true; }
    }
    if (b === 'AND' || b === 'BIC') {
      if (okMod) return true;
      if (isModImm(~v)) { ins.base = b === 'AND' ? 'BIC' : 'AND'; op2.value = (~v) >>> 0; ins.note = `assembler encodes as ${ins.base}${ins.s ? 'S' : ''} with #${hex(op2.value)}`; return true; }
    }
    if (b === 'ORR' || b === 'ORN') {
      if (okMod) return true;
      if (isModImm(~v)) { ins.base = b === 'ORR' ? 'ORN' : 'ORR'; op2.value = (~v) >>> 0; ins.note = `assembler encodes as ${ins.base}${ins.s ? 'S' : ''} with #${hex(op2.value)}`; return true; }
    }
    if (okMod) return true;
    err(line, `#${raw} (${hex(v)}) is not an encodable Operand2 constant (an 8-bit value, optionally shifted, or 0x00XY00XY / 0xXY00XY00 / 0xXYXYXYXY). Load it first with LDR Rx, =${raw}`);
    return false;
  };

  const cls = OPS[ins.base] ? OPS[ins.base].cls : 'it';
  ins.isBranch = false;
  switch (cls) {
    case 'it': {
      if (ops.length !== 1 || ops[0].k !== 'sym') return fail('IT needs a condition, e.g. "ITE GT"');
      const cc0 = ops[0].expr.toUpperCase();
      if (!COND_LIST.includes(cc0)) return fail(`"${ops[0].expr}" is not a condition code`);
      const cc = cc0 === 'HS' ? 'CS' : cc0 === 'LO' ? 'CC' : cc0;
      if (cc === 'AL' && /E/.test(ins.mask)) return fail('IT AL cannot have E (else) slots');
      const conds = [cc];
      for (const ch of ins.mask) conds.push(ch === 'T' ? cc : COND_INV[cc]);
      ins.it = { cond: cc, conds, pattern: 'T' + ins.mask };
      ins.cond = 'AL';
      break;
    }
    case 'mov': {
      if (ops.length < 2 || ops.length > 3) return fail(`${ins.base} takes "Rd, Operand2"`);
      const rd = needReg(ops[0], 'destination'); if (rd === null) return ins;
      ins.rd = rd;
      if (rd === 15) return fail('writing PC with MOV is outside the course model — return with BX LR');
      const op2 = parseOp2(ops.slice(1)); if (!op2) return ins;
      if (op2.type === 'imm') { if (!fitImm(op2)) return ins; if (rd === 13) return fail('SP cannot be loaded with an immediate via MOV'); }

      if (rest.length < 1 || rest.length > 2) return fail(`${ins.base} takes "{Rd,} Rn, Operand2"`);

      const rn = rest.length === 2 ? needReg(rest[1], 'first operand') : rd; if (rn === null) return ins;
      ins.rd = rd; ins.rn = rn; ins.optRd = rest.length === 1;
      const op2 = parseOp2(op2list); if (!op2) return ins;
      if (!noPC(rd, 'a destination') || !noPC(rn, 'a source')) return ins;
      if (op2.type === 'reg' && !noPC(op2.rm, 'a source')) return ins;
      if (ins.base !== 'ADD' && ins.base !== 'SUB') { if (!noSPPC(rd, 'destination') || !noSPPC(rn, 'source') || (op2.type === 'reg' && !noSPPC(op2.rm, 'source'))) return ins; }

    }
    case 'cmp': {
      let rest = ops.slice();

      if (rest.length !== 1) return fail(`${ins.base} takes "Rn, Operand2"${ins.base === 'CMP' ? ' — it has no destination; the result only sets flags' : ''}`);
      const rn = needReg(rest[0], 'first operand'); if (rn === null) return ins;
      ins.rn = rn;
      const op2 = parseOp2(op2list); if (!op2) return ins;
      if (!noPC(rn, 'an operand') || (op2.type === 'reg' && !noPC(op2.rm, 'an operand'))) return ins;
      if (ins.base !== 'CMP' && (rn === 13 || (op2.type === 'reg' && op2.rm === 13))) return fail(`SP cannot be used with ${ins.base}`);
      if (op2.type === 'imm' && !fitImm(op2)) return ins;
      ins.op2 = op2;
      break;
    }
    case 'mul': case 'div': {
      if (ops.length < 2 || ops.length > 3) return fail(`${ins.base} takes "{Rd,} Rn, Rm"`);
      if (ops.some((x) => x.k === 'imm')) return fail(`${ins.base} only takes registers — load the constant into a register first (MOV Rx, #n)`);
      const regs = ops.map((x, i) => needReg(x, `operand ${i + 1}`)); if (regs.includes(null)) return ins;

    }
    case 'mla': {
      if (ops.length !== 4) return fail(`${ins.base} takes "Rd, Rn, Rm, Ra" (${ins.base === 'MLA' ? 'Rd = Rn*Rm + Ra' : 'Rd = Ra − Rn*Rm'})`);
      const regs = ops.map((x, i) => needReg(x, `operand ${i + 1}`)); if (regs.includes(null)) return ins;
      if (regs.some((r) => r === 13 || r === 15)) return fail(`SP/PC cannot be used with ${ins.base}`);
      [ins.rd, ins.rn, ins.rm, ins.ra] = regs;
      break;
    }
    case 'long': {
      if (ops.length !== 4) return fail(`${ins.base} takes "RdLo, RdHi, Rn, Rm"`);
      const regs = ops.map((x, i) => needReg(x, `operand ${i + 1}`)); if (regs.includes(null)) return ins;
      if (regs.some((r) => r === 13 || r === 15)) return fail(`SP/PC cannot be used with ${ins.base}`);

      if (ins.rdlo === ins.rdhi) return fail('RdLo and RdHi must be different registers');
      break;
    }
    case 'shift': {
      if (ops.length < 2 || ops.length > 3) return fail(`${ins.base} takes "Rd, Rm, Rs" or "Rd, Rm, #n"`);
      const rd = needReg(ops[0], 'destination'); if (rd === null) return ins;
      const rm = ops.length === 3 ? needReg(ops[1], 'source') : rd; if (rm === null) return ins;
      if (!noSPPC(rd, 'destination') || !noSPPC(rm, 'source')) return ins;
      ins.rd = rd; ins.rm = rm;
      const last = ops[ops.length - 1];
      if (last.k === 'imm') {
        const a = evalImm(last.expr); if (a === null) return ins;
        const lim = { LSL: [0, 31], LSR: [1, 32], ASR: [1, 32], ROR: [1, 31] }[ins.base];

        ins.rs = last.r;
      } else return fail('shift amount must be a register or #n');
      break;
    }
    case 'rrx': {
      if (!nOps(2, '"Rd, Rm"')) return ins;
      const rd = needReg(ops[0], 'destination'), rm = needReg(ops[1], 'source'); if (rd === null || rm === null) return ins;
      if (!noSPPC(rd, 'destination') || !noSPPC(rm, 'source')) return ins;
      ins.rd = rd; ins.rm = rm;
      break;
    }

<script>/* Exercise checker: runs a program against test cases the way a C caller would. */
(function (g) {
'use strict';
const E = g.EMU || (typeof require !== 'undefined' ? require('./emu.js') : null);

function placeArgs(args) {
  let addr = E.ARRAY_BASE;
  const regs = {}, arrays = [];
  for (let r = 4; r <= 11; r++) regs['R' + r] = (0xCA110000 + r) >>> 0;   // values a C caller might be holding
  args.forEach((a, i) => {
    if (Array.isArray(a)) { arrays.push({ addr, values: a.slice() }); regs['R' + i] = addr; addr += 4 * Math.max(a.length, 1) + 0x40; }
    else regs['R' + i] = a >>> 0;
  });
  return { regs, arrays };
}
const fmtArg = (a, u) => Array.isArray(a) ? '[' + a.join(', ') + ']' : (u ? (a >>> 0 > 0xFFFF ? E.hex(a) : String(a >>> 0)) : String(a | 0));
const fmtVal = (v, u) => u ? String(v >>> 0) : String(v | 0);

function makeTester(prog, ex) {
  const t = {};
  const fname = (ex && ex.fname) || 'asm_func';
  t.prog = prog;
  t.init = (args = [], extra = {}) => {
    const p = placeArgs(args);
    const init = { regs: p.regs, arrays: p.arrays, mem: {} };
    if (extra.memLabels) for (const [k, v] of Object.entries(extra.memLabels)) if (prog.labels[k]) init.mem[prog.labels[k].addr] = v;
    if (extra.flags) init.flags = extra.flags;
    return init;
  };
  t.run = (args = [], extra = {}) => {
    const init = t.init(args, extra);
    const m = new E.Machine(prog, init);
    m.run(extra.max || 300000);
    m.arrays = init.arrays;
    return m;
  };
  t.word = (m, label, k = 0) => prog.labels[label] ? m.read32(prog.labels[label].addr + 4 * k) : undefined;
  t.arr = (m, i) => m.arrays[i].values.map((_, k) => m.read32(m.arrays[i].addr + 4 * k) | 0);
  t.has = (base) => prog.instrs.some((i) => i.origBase === base || i.base === base);
  t.call = (args, u) => `${fname}(${args.map((a) => fmtArg(a, u)).join(', ')})`;

  function exitProblem(m) {
    if (m.haltKind === 'return') return null;
    if (m.haltKind === 'fault') return m.haltReason;
    if (m.haltKind === 'halt') return 'stopped in a halt loop instead of returning with BX LR';
    if (m.haltKind === 'limit') return m.haltReason;
    return 'did not return';
  }

  // cases: array of arg arrays (or {args, memLabels}); ref returns number or expectation object
  t.fn = (cases, ref, opts = {}) => cases.map((c0) => {
    const c = Array.isArray(c0) ? { args: c0 } : c0;
    const m = t.run(c.args, c);
    const label = t.call(c.args, opts.u) + (c.memLabels ? ' with ' + Object.entries(c.memLabels).map(([k, v]) => `${k}=${E.hex(v)}`).join(', ') : '');
    const row = { label, debug: c };
    const prob = exitProblem(m);
    if (prob && !opts.allowHalt) return Object.assign(row, { ok: false, detail: prob });
    let exp = ref(...c.args.map((a) => Array.isArray(a) ? a.slice() : a), m, c);
    if (typeof exp === 'number') exp = { R0: exp };
    const bad = [], good = [];
    for (const [k, v] of Object.entries(exp)) {
      if (/^R\d+$/.test(k)) {
        const got = m.r[E.regNum(k)];
        const u = opts.u || (v > 0x7FFFFFFF);
        const disp = opts.hex ? E.hex : (x) => fmtVal(x, u) + ((x >>> 0) > 0xFFFF && ((x | 0) > 0xFFFF || (x | 0) < -0xFFFF) ? ` (${E.hex(x)})` : '');
        if ((got >>> 0) !== (v >>> 0)) bad.push(`expected ${k} = ${disp(v)}, got ${disp(got)}`);
        else good.push(`${k} = ${disp(got)}`);
      } else if (k === 'flags') {
        const gotF = ['N', 'Z', 'C', 'V'].map((f) => `${f}=${m.f[f]}`).join(' ');
        const okF = Object.entries(v).every(([f, b]) => m.f[f] === b);
        (okF ? good : bad).push(okF ? `flags ${gotF}` : `expected flags ${Object.entries(v).map(([f, b]) => f + '=' + b).join(' ')}, got ${gotF}`);
      } else if (k === 'words') {
        for (const [lab, want] of Object.entries(v)) {
          if (!prog.labels[lab]) { bad.push(`label ${lab} is not defined`); continue; }
          const wants = Array.isArray(want) ? want : [want];
          const gotA = wants.map((_, j) => t.word(m, lab, j) | 0);
          if (gotA.some((x, j) => (x >>> 0) !== (wants[j] >>> 0))) bad.push(`expected ${lab} = ${wants.map((x) => x | 0).join(', ')}, got ${gotA.join(', ')}`);
          else good.push(`${lab} = ${gotA.join(', ')}`);
        }
      } else if (k === 'arrays') {
        for (const [i, want] of Object.entries(v)) {
          const gotA = t.arr(m, +i);
          if (gotA.some((x, j) => (x >>> 0) !== (want[j] >>> 0))) bad.push(`expected array ${+i + 1} = [${want.map((x) => x | 0).join(', ')}], got [${gotA.join(', ')}]`);
          else good.push(`array ${+i + 1} = [${gotA.join(', ')}]`);
        }
      }
    }
    if (opts.aapcs) { const a = m.aapcsReport(); if (a.length) bad.push(...a); }
    if (opts.extra) { const x = opts.extra(m, c.args); if (x) bad.push(x); }
    return Object.assign(row, { ok: bad.length === 0, detail: bad.length ? bad.join('; ') : good.join(', ') });
  });

  t.req = (ok, label, failMsg) => [{ ok: !!ok, label, detail: ok ? 'requirement met' : failMsg, static: true }];
  t.uses = (base, why) => t.req(t.has(base), `uses ${base}`, why || `this exercise needs ${base}`);
  t.avoids = (bases, why) => { const hit = [].concat(bases).filter((b) => t.has(b)); return t.req(!hit.length, `does not use ${[].concat(bases).join('/')}`, why || `remove ${hit.join(', ')}`); };
  return t;
}

function checkExercise(ex, src) {
  const prog = E.assemble(src, ex.opts || {});
  if (!prog.ok) return { prog, rows: [{ ok: false, label: 'assembles', detail: `${prog.errors.length} assembler error(s) — first: line ${prog.errors[0].line}: ${prog.errors[0].msg}` }], pass: false };
  if (!ex.noFunc && !prog.labels[ex.fname || 'asm_func']) return { prog, rows: [{ ok: false, label: 'entry point', detail: `define the label ${ex.fname || 'asm_func'}: at the start of your function` }], pass: false };
  const t = makeTester(prog, ex);
  let rows;
  try { rows = [].concat(...ex.check(t).map((x) => Array.isArray(x) ? x : [x])); }
  catch (e) { rows = [{ ok: false, label: 'checker', detail: 'checker error: ' + e.message }]; }
  return { prog, rows, pass: rows.length > 0 && rows.every((r) => r.ok), t };
}

const api = { checkExercise, makeTester, placeArgs, fmtArg };
if (typeof module !== 'undefined' && module.exports) module.exports = api;
g.CHECK = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  body: `
<p>In EE2028 assembly never runs alone. A C program calls your function the way it calls any other C function, and the processor hands the arguments over in registers.</p>
<div class="trio">
<pre class="c">// main.c
extern int asm_func(int x, int y);

int main(void) {
    int r = asm_func(3, 4);
    // r is whatever asm_func left in R0
}</pre>
<pre class="asm">@ asm_func.s
    .syntax unified
    .thumb
    .global asm_func
asm_func:          @ x arrives in R0, y in R1
    ADD R0, R0, R1 @ result goes back in R0
    BX LR          @ return to main()</pre>
</div>
<h3>The calling rule (AAPCS)</h3>
<table class="ref">
<tr><th>What</th><th>Where</th></tr>
<tr><td>arguments 1–4</td><td>R0, R1, R2, R3</td></tr>
<tr><td>return value</td><td>R0 (a 64-bit value uses R0 low, R1 high)</td></tr>
<tr><td>return address</td><td>LR (R14), set by the caller's BL</td></tr>
<tr><td>return</td><td><code>BX LR</code>: PC ← LR</td></tr>
</table>
<h3>The machine you are programming</h3>
<p>The Cortex-M4 has 16 registers of 32 bits each. R0–R12 are general purpose. R13 is SP (stack pointer), R14 is LR (link register) and R15 is PC (the address of the next instruction). The APSR holds the four flags N, Z, C and V (unit 7).</p>
<p>The workbench on the right shows all of them. When you <b>Step</b>, the instruction under the PC runs, the registers it changed light up, and the trace panel explains what happened in plain arithmetic. <b>Back</b> undoes a step.</p>
<div class="note"><b>Course model.</b> As in the lecture notes, every instruction here occupies one 4-byte word and PC reads as (instruction address + 4). Real Thumb-2 code mixes 2- and 4-byte instructions; the arithmetic is the same either way.</div>
<h3>Instruction format</h3>
<pre class="plain">label:  MNEMONIC  operand1, operand2, ...   @ comment (or ; comment)</pre>
<p>The label is optional. The first operand is usually the destination. Anything in <code>{braces}</code> in the syntax reference is optional, so <code>ADD R0, R1</code> means <code>ADD R0, R0, R1</code>.</p>
<p>Try it: load this example, set R0 and R1 in the call bar, and press Step until it returns.</p>
<pre class="asm" data-init="R0=3,R1=4">asm_func:
    ADD R0, R0, R1    @ R0 = x + y
    BX LR             @ back to main()</pre>
`,

    {

      prompt: '<p>Write <code>int asm_func(void)</code> that returns 2028. <code>MOV Rd, #imm</code> copies a constant into a register.</p>',

L.push({

  body: `
<p>Assembly has no named variables. You decide which register holds which value, and you keep that plan in your head (or in comments).</p>
<div class="trio">
<pre class="py">x = 5
y = x
z = -1</pre>
<pre class="c">int x = 5;
int y = x;
int z = -1;</pre>
<pre class="asm">MOV R0, #5      @ x
MOV R1, R0      @ y = x
MVN R2, #0      @ z = NOT 0 = -1</pre>
</div>
<h3>MOV{S} Rd, Op2</h3>
<p><b>Op2</b> (Operand2) is the flexible second operand: a constant <code>#imm</code>, a register <code>Rm</code>, or a register with a shift <code>Rm, LSL #n</code> (unit 13).</p>
<h3>Which constants fit?</h3>
<p>A constant is stored inside the 32-bit instruction word, so only some values fit. The lecture gives the field sizes as <code>#imm8</code> (0–255), <code>#imm12</code> (0–4095) and <code>#imm16</code> (0–65535). On the Cortex-M4 that works out as:</p>
<table class="ref">
<tr><th>Instruction</th><th>Constant allowed</th></tr>
<tr><td><code>MOV Rd, #imm</code></td><td>0–65535 (imm16), or an Op2 pattern</td></tr>
<tr><td><code>ADD/SUB Rd, Rn, #imm</code></td><td>0–4095 (imm12), or an Op2 pattern</td></tr>
<tr><td>everything else, and any S form</td><td>an Op2 pattern: an 8-bit value (0–255), optionally shifted left, e.g. 0xFF000000 or 0x3FC</td></tr>
<tr><td>anything bigger</td><td><code>LDR Rd, =value</code>, the pseudo-instruction from unit 4</td></tr>
</table>
<p>The assembler quietly fixes a few cases for you. <code>MOV R0, #-1</code> becomes <code>MVN R0, #0</code>, and <code>ADD R0, #-4</code> becomes <code>SUB R0, #4</code>. The trace shows a note when this happens.</p>
<h3>MVN: move NOT</h3>
<p><code>MVN Rd, Op2</code> puts the bitwise complement of Op2 in Rd. Two's complement says <code>-x = NOT x + 1</code>, so <code>NOT 0 = 0xFFFFFFFF = -1</code>.</p>

    MOV R1, #60000        @ fits imm16 (MOV only)
    MOV R2, #0xFF000000   @ 8-bit pattern shifted left
    MVN R3, #0            @ -1
    BX LR</pre>
<div class="warn">Every immediate needs <code>#</code>. <code>MOV R0, 5</code> is an error here, as the course syntax requires.</div>
`,

<p>An expression like <code>3*x + y - 7</code> turns into one instruction per operator. You choose the evaluation order and the registers that hold the partial results.</p>

<tr><td><code>ADD{S} {Rd,} Rn, Op2</code></td><td>Rd ← Rn + Op2</td></tr>
<tr><td><code>SUB{S} {Rd,} Rn, Op2</code></td><td>Rd ← Rn − Op2</td></tr>
<tr><td><code>MUL{S} {Rd,} Rn, Rm</code></td><td>Rd ← (Rn × Rm), low 32 bits</td></tr>
<tr><td><code>MLA Rd, Rn, Rm, Ra</code></td><td>Rd ← Rn × Rm + Ra</td></tr>
<tr><td><code>MLS Rd, Rn, Rm, Ra</code></td><td>Rd ← Ra − Rn × Rm</td></tr>

<p>MUL, MLA and MLS take <b>registers only</b>. To multiply by a constant, MOV it into a register first. MLA and MLS have no S form on the Cortex-M4, even though some summaries list <code>MLA{S}</code>.</p>

    MUL R1, R2, R1    @ 3*y
    MLA R0, R0, R0, R1 @ x*x + 3y

</div>

  body: `
<table class="ref">
<tr><th>Syntax</th><th>Meaning</th></tr>
<tr><td><code>SDIV {Rd,} Rn, Rm</code></td><td>signed Rn ÷ Rm, rounded toward zero</td></tr>
<tr><td><code>UDIV {Rd,} Rn, Rm</code></td><td>unsigned Rn ÷ Rm</td></tr>
</table>
<p>The S and U here are <b>prefixes</b> that pick signed or unsigned arithmetic. They are a different thing from the {S} <b>suffix</b> that updates flags, and division never updates flags.</p>
<p>There is no remainder instruction. Compute it from the quotient with MLS:</p>
<div class="trio">
<pre class="py"># Python floors:
-7 // 2   # -4
-7 % 2    #  1</pre>
<pre class="c">// C truncates:
-7 / 2    // -3
-7 % 2    // -1</pre>
<pre class="asm">SDIV R2, R0, R1     @ q = a / b
MLS  R0, R2, R1, R0 @ a - q*b</pre>
</div>
<p>SDIV matches C, not Python. Python's <code>//</code> rounds down; C and the hardware round toward zero.</p>
<div class="note">Dividing by zero on the Cortex-M4 gives 0 by default and does not trap. Setting the DIV_0_TRP bit in the SCB makes it raise a UsageFault instead.</div>

    MLS  R0, R2, R1, R0   @ r = -7 - (-3*2) = -1
    BX LR</pre>

<p>Three assembler directives declare data. They are instructions to the assembler, not ARM instructions, so their constants take no <code>#</code>.</p>
<table class="ref">
<tr><th>Directive</th><th>C analogue</th><th>Memory?</th></tr>
<tr><td><code>.equ GAIN, 3</code></td><td><code>#define GAIN 3</code></td><td>none: a name for a number, substituted at assembly time</td></tr>
<tr><td><code>OFFSET: .word 250</code></td><td><code>const int OFFSET = 250;</code></td><td>one initialised word (in flash, next to the code)</td></tr>
<tr><td><code>.lcomm RESULT, 4</code></td><td><code>static int RESULT;</code></td><td>4 bytes reserved in SRAM, uninitialised</td></tr>
</table>
<p>By convention <code>.equ</code> goes at the top and <code>.word</code>/<code>.lcomm</code> at the end, after <code>BX LR</code>. Data placed in the middle of the code would get executed as if it were instructions.</p>
<h3>Getting things into registers</h3>
<table class="ref">
<tr><th>You write</th><th>Register receives</th><th>Mode</th></tr>
<tr><td><code>LDR R1, =GAIN</code></td><td>3 (the symbol's value)</td><td>pseudo-instruction</td></tr>
<tr><td><code>MOV R1, #GAIN</code></td><td>3 (fine if it fits as an immediate)</td><td>immediate</td></tr>
<tr><td><code>LDR R1, OFFSET</code></td><td>250, the <b>contents</b> at label OFFSET</td><td>PC-relative</td></tr>
<tr><td><code>LDR R1, =OFFSET</code></td><td>the <b>address</b> of OFFSET (a pointer)</td><td>pseudo-instruction</td></tr>
<tr><td><code>LDR R1, =RESULT</code></td><td>the address of RESULT, used for STR</td><td>pseudo-instruction</td></tr>
</table>
<p><b>The equals sign means address, or a literal value.</b> Without it you get the contents. Mixing the two up is the most common bug in this course.</p>
<h3>What the assembler does with <code>LDR =</code></h3>
<p>It allocates a word in a <b>literal pool</b> after your code, puts the value there, and emits a PC-relative load from that word. Open the <b>Listing</b> tab after assembling to see the pool and the offset it calculated.</p>
<h3>No PC-relative STR</h3>
<p>ARMv7E-M has <code>LDR Rd, LABEL</code> but no <code>STR Rd, LABEL</code>. To write a variable, load its address first:</p>
<pre class="asm">    .equ GAIN, 3
asm_func:
    LDR R1, =GAIN       @ R1 = 3 (value of the symbol)
    LDR R2, OFFSET      @ R2 = 250 (contents of OFFSET)

    LDR R3, =RESULT     @ R3 = &RESULT
    STR R0, [R3]        @ RESULT = R0
    BX LR

OFFSET: .word 250
    .lcomm RESULT, 4</pre>

`,

<tr><td><code>LDR Rt, [Rn, #off]!</code></td><td>Rt ← [Rn+off], <b>then</b> Rn ← Rn+off</td><td><code>x = *++p;</code></td></tr>

  body: `
<p>An instruction with the <b>S suffix</b> (ADDS, SUBS, MOVS…) also updates the four APSR flags. CMP, CMN, TST and TEQ always update them and keep nothing else.</p>
<table class="ref">
<tr><th>Flag</th><th>Set to 1 when</th><th>Meaningful for</th></tr>
<tr><td>N</td><td>bit 31 of the result is 1 (negative)</td><td>signed</td></tr>
<tr><td>Z</td><td>the result is zero</td><td>both</td></tr>
<tr><td>C</td><td>add: result ≥ 2<sup>32</sup> (carry out). Subtract: no borrow, i.e. Rn ≥ Op2 unsigned. Shift: the last bit shifted out</td><td>unsigned</td></tr>
<tr><td>V</td><td>add/sub: the signed result does not fit in 32 bits (≥ 2<sup>31</sup> or &lt; −2<sup>31</sup>)</td><td>signed</td></tr>
</table>
<p>The hardware does not know whether you meant signed or unsigned. It computes both C and V, and you pick which one to test.</p>
<table class="ref">
<tr><th>Syntax</th><th>Computes</th><th>Like</th></tr>
<tr><td><code>CMP Rn, Op2</code></td><td>Rn − Op2</td><td>SUBS, result discarded</td></tr>
<tr><td><code>CMN Rn, Op2</code></td><td>Rn + Op2</td><td>ADDS, result discarded (compare with the negative)</td></tr>
<tr><td><code>TST Rn, Op2</code></td><td>Rn AND Op2</td><td>ANDS, result discarded</td></tr>
<tr><td><code>TEQ Rn, Op2</code></td><td>Rn XOR Op2</td><td>EORS, result discarded</td></tr>
</table>
<p>The flags panel lists every condition code (EQ, GT, HI…) and whether it is currently true. Step through these and watch the panel:</p>
<pre class="asm">asm_func:
    MOV  R1, #0x7FFFFFFF  @ assembler: MVN R1, #0x80000000
    ADDS R0, R1, #1       @ signed overflow: V=1, N=1
    MOV  R1, #0xFFFFFFFF  @ -1, or 4294967295
    ADDS R0, R1, #1       @ unsigned carry: C=1, Z=1
    MOV  R2, #5
    CMP  R2, #7           @ 5-7: borrow, so C=0; N=1
    CMP  R2, #5           @ equal: Z=1, C=1
    BX LR</pre>
`,

<p><code>B{cond} label</code> jumps when the condition holds and otherwise falls through. An <code>if</code> becomes a compare followed by a branch on the <b>inverse</b> condition, which jumps over the then-block.</p>

  body: `
<p>In Thumb-2, only <code>B{cond}</code> can be conditional on its own. Any other instruction with a condition suffix must sit inside an <b>IT</b> (If-Then) block. IT can be followed by up to three more T (then) or E (else) letters, giving one to four conditional instructions:</p>
<div class="trio">
<pre class="c">r = (x > y) ? x : y;</pre>
<pre class="asm">    CMP   R0, R1
    ITE   GT          @ Then GT, Else LE
    MOVGT R2, R0
    MOVLE R2, R1</pre>
</div>
<table class="ref">
<tr><th>Rule</th><th>Why it trips people up</th></tr>
<tr><td>Each instruction in the block carries a suffix: the IT condition for T slots, its inverse for E slots</td><td><code>ITE GT</code> needs <code>…GT</code> then <code>…LE</code></td></tr>
<tr><td>At most 4 instructions (IT, ITT, ITE, ITTE, ITET…)</td><td>longer runs need another IT or branches</td></tr>
<tr><td>A branch may only be the last instruction of the block</td><td></td></tr>
<tr><td>Skipped instructions still take a slot but do nothing</td><td>the trace shows "skipped"</td></tr>
</table>
<p>Why bother? A short IT block avoids a pipeline-flushing branch and keeps the code in a straight line.</p>
<pre class="asm" data-init="R0=4,R1=9">asm_func:
    CMP   R0, R1
    ITE   GT
    MOVGT R2, R0        @ runs if x > y
    MOVLE R2, R1        @ runs otherwise
    MOV   R0, R2
    BX LR</pre>
`,

  body: `
<p>A loop is a backward branch. Three shapes cover nearly everything:</p>
<div class="trio">
<pre class="c">// while (i &lt; n) { ... i++; }
// for (i = n; i != 0; i--)
// do { ... } while (--n);</pre>
<pre class="asm">top:                @ while
    CMP  R1, R2
    BGE  done
    @ ... body ...
    ADD  R1, #1
    B    top
done:

loop:               @ count down
    @ ... body ...
    SUBS R2, R2, #1 @ sets Z when 0
    BNE  loop</pre>
</div>
<p>The count-down form puts S on the decrement, so the SUBS itself sets Z when the counter reaches zero and no CMP is needed. It is the classic embedded idiom.</p>
<div class="trio">
<pre class="py">total = 0
for i in range(n, 0, -1):
    total += i</pre>
<pre class="asm">    MOV  R1, #0         @ total
loop:
    ADD  R1, R1, R0
    SUBS R0, R0, #1

<tr><td><code>~a</code></td><td><code>MVN{S} Rd, Op2</code></td><td>complement</td></tr>
<tr><td><code>a &amp; ~b</code></td><td><code>BIC{S} {Rd,} Rn, Op2</code></td><td><b>bit clear</b>: force bits off</td></tr>
<tr><td><code>a | ~b</code></td><td><code>ORN{S} {Rd,} Rn, Op2</code></td><td></td></tr>

<p>With S, the logic instructions set N and Z from the result. C comes from the barrel shifter (or from a rotated constant), and V is never touched.</p>

<table class="ref">

<tr><td><code>ROR{S} Rd, Rm, Rs</code> or <code>#n</code></td><td>rotate right</td><td></td></tr>

<p>With S, C receives the <b>last bit shifted out</b>.</p>
<div class="warn">ASR rounds toward −∞: −7 ASR 1 = −4. SDIV by 2 rounds toward 0 and gives −3. Python's <code>&gt;&gt;</code> agrees with ASR; C's <code>/</code> agrees with SDIV.</div>
<h3>The barrel shifter in Operand2</h3>
<p>Any Op2 register can be shifted on the way in, at no extra cost:</p>
<div class="trio">
<pre class="c">y = x * 5;
z = a + (b &lt;&lt; 3);</pre>
<pre class="asm">ADD R1, R0, R0, LSL #2 @ x + 4x
ADD R2, R3, R4, LSL #3</pre>
</div>
<p>Inside Op2 the shift amount must be an immediate. Register-controlled shifts only exist as the standalone LSL/LSR/ASR/ROR instructions.</p>
<pre class="asm" data-init="R0=-7">asm_func:
    ASR  R1, R0, #1          @ -4 (rounds down)
    MOV  R2, #2
    SDIV R2, R0, R2          @ -3 (rounds to zero)
    LSR  R3, R0, #28         @ logical: top nibble of 0xFFFFFFF9
    ADD  R0, R0, R0, LSL #2  @ x*5 with no multiply
    BX LR</pre>

<h3>The LR problem</h3>
<p>Your <code>asm_func</code> was called with a return address in LR. As soon as it calls another function with BL, that LR is overwritten, and the final BX LR returns to the wrong place. Save LR on the stack on entry, and pop it straight into PC on exit:</p>

<h3>Who may clobber what (AAPCS)</h3>
<table class="ref">
<tr><th>Registers</th><th>Rule</th></tr>

<tr><td>SP</td><td>must be back where it started when you return</td></tr>
<tr><td>LR</td><td>holds the return address; save it before any BL</td></tr>
</table>

<div class="refsec"><h3>Memory addressing (LDR / STR)</h3>
<table class="ref">
<tr><td><code>LDR|STR Rt, [Rn {, #off}]</code></td><td>offset: EA = Rn + off; Rn unchanged (off −255…4095)</td></tr>

<tr><td><code>LDR Rd, =value|LABEL|SYM</code></td><td>pseudo-instruction: a 32-bit value, an address or a .equ value, via the literal pool. LDR only.</td></tr>

<div class="refsec"><h3>Move and arithmetic</h3>
<table class="ref">
<tr><th>Syntax</th><th>Operation</th><th>Flags with S</th></tr>
<tr><td><code>MOV{S} Rd, Op2</code></td><td>Rd ← Op2</td><td>N Z C</td></tr>

<tr><td><code>ADD{S} {Rd,} Rn, Op2</code></td><td>Rd ← Rn + Op2</td><td>N Z C V</td></tr>
<tr><td><code>SUB{S} {Rd,} Rn, Op2</code></td><td>Rd ← Rn − Op2</td><td>N Z C V</td></tr>

<div class="refsec"><h3>Compare and test (flags only)</h3>
<table class="ref">
<tr><td><code>CMP Rn, Op2</code></td><td>Rn − Op2</td></tr>
<tr><td><code>CMN Rn, Op2</code></td><td>Rn + Op2</td></tr>
<tr><td><code>TST Rn, Op2</code></td><td>Rn AND Op2 (N Z C)</td></tr>
<tr><td><code>TEQ Rn, Op2</code></td><td>Rn XOR Op2 (N Z C)</td></tr>

<div class="refsec"><h3>Logic, shifts, masks</h3>
<table class="ref">
<tr><td><code>AND|ORR|EOR{S} {Rd,} Rn, Op2</code></td><td>&amp;, |, ^ (V never changes)</td></tr>

<tr><td><code>ORN{S} {Rd,} Rn, Op2</code></td><td>Rn OR NOT Op2</td></tr>
<tr><td><code>LSL|LSR|ASR|ROR{S} Rd, Rm, Rs|#n</code></td><td>shift/rotate; C = last bit out</td></tr>
<tr><td><code>RRX{S} Rd, Rm</code></td><td>rotate right through C by 1</td></tr>
</table></div>

<div class="refsec"><h3>Branches and subroutines</h3>
<table class="ref">
<tr><td><code>B{cond} label</code></td><td>jump (the only instruction allowed to be conditional outside an IT block)</td></tr>

<tr><td><code>PUSH {reglist}</code></td><td>SP −= 4n; lowest register at lowest address</td></tr>

<div class="refsec"><h3>Conditions and IT blocks</h3>
<table class="ref">
<tr><th>Code</th><th>Test</th><th>Meaning</th></tr>
<tr><td>EQ / NE</td><td>Z==1 / Z==0</td><td>equal / not equal</td></tr>
