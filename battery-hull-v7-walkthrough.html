<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Battery Hull V7 Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage with a caption card docked bottom-left and a step rail on top */
:root{
  --bg:#e9eeec; --stage:#dfe6e3; --card:#ffffffee; --ink:#18201e; --muted:#58665f; --rule:#c4cfcb;
  --accent:#0f8a8a; --pwr:#c8321e; --warn:#c27c0e;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1413;--stage:#141b1a;--card:#1b2321ee;--ink:#e3ebe8;--muted:#9aaba5;--rule:#2f3b38;--accent:#3cc4c4;--pwr:#ff6b55;--warn:#f0a83a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1413;--stage:#141b1a;--card:#1b2321ee;--ink:#e3ebe8;--muted:#9aaba5;--rule:#2f3b38;--accent:#3cc4c4;--pwr:#ff6b55;--warn:#f0a83a;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.app{position:relative;height:100%;min-height:560px;display:grid;grid-template-rows:auto 1fr;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px;box-sizing:border-box}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-width:0}
.top h1{font-family:var(--f-disp);font-weight:600;font-size:20px;margin:0;letter-spacing:.02em;margin-right:auto}
.rail{display:flex;gap:6px;flex-wrap:wrap}
.rail button,.ctl{font-family:var(--f-mono);font-size:12px;border:1px solid var(--rule);background:transparent;color:var(--muted);padding:5px 9px;border-radius:4px;cursor:pointer}
.rail button[aria-current="step"]{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.rail button:focus-visible,.ctl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;min-height:0;border:1px solid var(--rule);background:var(--stage);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.card{position:absolute;left:12px;bottom:12px;max-width:min(430px,calc(100% - 24px));background:var(--card);border:1px solid var(--rule);padding:12px 14px;backdrop-filter:blur(4px)}
.card .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.card h2{font-family:var(--f-disp);font-weight:600;font-size:22px;margin:2px 0 6px;text-wrap:balance}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.card li b{color:var(--ink);font-weight:600}
.card .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.bar{height:3px;background:var(--rule);margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.hint{position:absolute;right:10px;top:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.legend{position:absolute;right:10px;bottom:10px;display:grid;gap:3px;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--rule);padding:6px 8px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;display:inline-block}
@media (max-width:640px){.legend{display:none}.card h2{font-size:18px}.card ul{font-size:13px}}
</style>

<div class="app">
  <div class="top">
    <h1>Battery Hull V7 · changes</h1>
    <div class="rail" id="rail" role="tablist" aria-label="Steps"></div>
    <button class="ctl" id="play" type="button" aria-pressed="true">Pause</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="3D view of the battery hull, pack, board, harness and connector"></canvas>
    <div class="hint">drag to orbit</div>
    <div class="legend" aria-hidden="true">
      <span><i style="background:#3b9f5a"></i>PCB</span>
      <span><i style="background:#c8321e"></i>8 AWG harness / terminals</span>
      <span><i style="background:#e8e6e1"></i>SBS X‑75A (placeholder)</span>
      <span><i style="background:#e0902a"></i>battery</span>
      <span><i style="background:#4cb7b7"></i>hull / pod proposal</span>
    </div>
    <div class="card" id="card" aria-live="polite">
      <div class="k" id="k"></div><h2 id="t"></h2><ul id="b"></ul>
      <div class="bar"><i id="prog"></i></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const STEPS=[
 {k:"01 · as found (V6)",t:"Board overhangs the plate",b:["PCB <b class='num'>125 × 57</b> mm vs plate <b class='num'>95.95 × 67</b>","XT90 pair hangs <b class='num'>32 mm</b> past the plate at the cap end","U4, J5 and 3 test points hit the plate (+2 to +4 mm)"],cam:[145,-5,125,2.35]},
 {k:"02 · ECAD (Kicad_V6)",t:"Board now fits the plate",b:["Outline <b class='num'>95.5 × 66</b> mm, inside the plate","XT90s → <b>4 × REDCUBE 7466005 M5</b> on the B side, 70 A each","J7 → TC2030 pads · test points → SMD · J4/J5 DNP","TOLT FETs on the plate need an insulating TIM ≤ <b class='num'>0.24 mm</b>"],cam:[150,-5,120,2.2]},
 {k:"03 · MCAD route A",t:"Harness under the battery",b:["Notch in the mount sheet <b class='num'>X 8–48, Z &lt; −17</b>","Ø15 bundle (2 × 8 AWG + 6 × 24 AWG), every bend <b class='num'>R ≥ 40</b>","<b class='num'>269 mm</b> long · 3 mm clear of the battery"],cam:[75,-45,150,-0.55]},
 {k:"04 · pack ↔ hull",t:"Anderson SBS X‑75A 6AUX",b:["Power P+ / P− (AUV_NEG on the pre‑mate contact)","Aux: CAN_P, CAN_N, CAN_GND, SMBD, SMBC, SMB ref","Placeholder sizes put the shoulder at <b class='num'>≈170 mm</b>, not 100","Mates cold: Q_DSG is off until the reed switch turns it on"],cam:[110,-70,165,-0.85]},
 {k:"05 · battery",t:"4S2P Samsung 30T",b:["<b class='num'>86.4 Wh</b> · under 100 Wh, carry‑on with no airline approval","<b class='num'>70 A</b> combined rating · <b class='num'>30 A</b> per cell at the 60 A fuse","Block <b class='num'>70 × 84 × 42</b> mm in a 200 × 85 × 50 bay","Needs a pack‑level UN38.3 test and the Wh marked on the case"],cam:[110,-45,150,-0.35]}
];
const DUR=7000, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rail=document.getElementById('rail');
STEPS.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.id='step'+i;b.textContent=String(i+1).padStart(2,'0');b.setAttribute('role','tab');b.onclick=()=>go(i,true);rail.appendChild(b);});

const canvas=document.getElementById('c'), stage=document.getElementById('stage');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});}catch(e){document.getElementById('b').innerHTML='<li>3D needs WebGL, which this browser has turned off.</li>';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(35,1,1,5000);
scene.add(new THREE.HemisphereLight(0xffffff,0x667777,0.95));
const dl=new THREE.DirectionalLight(0xffffff,0.7);dl.position.set(200,300,250);scene.add(dl);
// mapping: three.x = X (down hull), three.y = Z, three.z = -Y   (mm, V6 coords)
const V=(X,Y,Z)=>new THREE.Vector3(X,Z,-Y);
function box(x0,y0,z0,x1,y1,z1,color,op=1){
  const g=new THREE.BoxGeometry(x1-x0,z1-z0,y1-y0);
  const m=new THREE.MeshStandardMaterial({color,transparent:op<1,opacity:op,roughness:.6,metalness:.1,depthWrite:op>=1});
  const o=new THREE.Mesh(g,m);o.position.copy(V((x0+x1)/2,(y0+y1)/2,(z0+z1)/2));scene.add(o);o.userData.op=op;return o;}
function edges(o,color){const e=new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry),new THREE.LineBasicMaterial({color,transparent:true,opacity:.55}));e.position.copy(o.position);scene.add(e);return e;}
function cyl(x,y,z,r,h,axis,color){const g=new THREE.CylinderGeometry(r,r,h,28);const m=new THREE.MeshStandardMaterial({color,roughness:.4,metalness:.3,transparent:true,opacity:1});const o=new THREE.Mesh(g,m);o.position.copy(V(x,y,z));
  if(axis==='y')o.rotation.x=Math.PI/2; if(axis==='x')o.rotation.z=Math.PI/2; scene.add(o);o.userData.op=1;return o;}

// hull (transparent) + bay
const hull=box(-14,-90,-42,230,43,36,0x4cb7b7,.07); const hullE=edges(hull,0x2f8f8f);
const bay=box(-14,-120,-42,37,-88,36,0x4cb7b7,.07); const bayE=edges(bay,0x2f8f8f);
const pod=box(15,-136,-45,172,-88,39,0x4cb7b7,.28); const podE=edges(pod,0x0f8a8a);
// battery placeholder + 4S2P cells
const batt=box(2,-79.5,-16.5,202,5.5,33.5,0xe0902a,.35);
const cells=[];for(let j=0;j<4;j++)for(let k=0;k<2;k++){cells.push(cyl(100,-72+j*21.2,-6+k*21.2+5,10.7,70,'x',k?0x2f6fb0:0x1f4f80));}
// mount sheet with notch
const mountA=box(48,5.5,-39.5,205,7.5,33.5,0x8a9592,.9), mountB=box(0,5.5,-17,48,7.5,33.5,0x8a9592,.9), mountC=box(0,5.5,-39.5,8,7.5,-17,0x8a9592,.9);
const notch=box(8,5.0,-39.5,48,8.0,-17,0xc8321e,.0);
// plate (frame approximation: outline minus window)
const plate=[box(109,21.44,-39.5,205,24.44,-34.5,0xb9c0bd,.95),box(109,21.44,22.5,205,24.44,27.5,0xb9c0bd,.95),box(109,21.44,-34.5,131.5,24.44,22.5,0xb9c0bd,.95),box(185,21.44,-34.5,205,24.44,-22.5,0xb9c0bd,.95),box(185,21.44,10.5,205,24.44,22.5,0xb9c0bd,.95)];
// old PCB + XT90s
const pcbOld=box(77.25,18.2,-34.5,202.25,18.9,22.5,0x3b9f5a,1);
const xt=[box(82,15.7,-29.5,109,29.2,-8.3,0xe7c43a,1),box(83.6,15.7,-3.8,109.1,29.2,17.5,0xe7c43a,1)];
const clash=[box(180.6,18.9,-31.6,188.3,23.4,-21.2,0xff3b2f,1),box(182.8,17.2,6.4,191.4,25.4,16,0xff3b2f,1)];
// new PCB + terminals
const pcbNew=box(109.25,18.2,-39,204.75,18.9,27,0x3b9f5a,1);
const terms=[[125.75,-33.4],[115.25,-17],[115.25,8.5],[125.75,21.6]].map(([x,z])=>cyl(x,15.7,z,4.5,5,'y',0xc8321e));
// harness
const P=[[107,16,10],[81.9,16,-18.4],[77.9,16,-22.4],[73.4,16,-25.8],[68.4,16,-28.5],[63.1,16,-30.4],[57.6,16,-31.6],[52,16,-32],[46.8,15.7,-32],[41.6,14.6,-32],[36.7,13,-32],[32,10.6,-32],[27.6,7.7,-32],[23.7,4.3,-32],[20.3,.4,-32],[17.4,-4,-32],[15,-8.7,-32],[13.4,-13.6,-32],[12.3,-18.8,-32],[12,-24,-32],[12,-68,-32],[12.3,-73.2,-31.8],[13.2,-78.4,-31.3],[14.7,-83.3,-30.5],[16.7,-88,-29.4],[19.2,-92.4,-27.9],[22.2,-96.3,-26.2],[25.6,-99.7,-24.3],[29.4,-102.6,-22.2],[33.5,-105,-19.8],[37.8,-106.6,-17.4],[42.3,-107.7,-14.9],[46.8,-108,-12.3],[51.9,-108,-9.6],[56.7,-108,-7.8],[61.7,-108,-6.6],[66.8,-108,-6],[73,-108,-6]];
const curve=new THREE.CatmullRomCurve3(P.map(p=>V(...p)),false,'centripetal');
const tubeG=new THREE.TubeGeometry(curve,260,7.5,16,false);
const tube=new THREE.Mesh(tubeG,new THREE.MeshStandardMaterial({color:0xc8321e,roughness:.5,transparent:true,opacity:1}));tube.userData.op=1;scene.add(tube);
const tubeN=tubeG.index.count;
// SBS placeholders
const yc=-108,zc=-6;
const plug=box(73,yc-13.35,zc-30.75,148,yc+13.35,zc+30.75,0xe8e6e1,1);
const recF=box(148,yc-13.35,zc-30.75,168,yc+13.35,zc+30.75,0xd6d3cc,1);
const flange=box(168,yc-22.5,zc-35.3,172,yc+22.5,zc+35.3,0x2b2b2b,1);
const recR=box(172,yc-13.35,zc-30.75,227,yc+13.35,zc+30.75,0xd6d3cc,1);

const G={
 old:[pcbOld,...xt],clash,newb:[pcbNew,...terms],harness:[tube],notch:[notch],sbs:[plug,recF,flange,recR],pod:[pod,podE],batt:[batt],cells,
};
// visibility per step: target opacity multiplier
const VIS=[
 {old:1,clash:1,newb:0,harness:0,notch:0,sbs:0,pod:0,batt:1,cells:0},
 {old:0,clash:0,newb:1,harness:0,notch:0,sbs:0,pod:0,batt:1,cells:0},
 {old:0,clash:0,newb:1,harness:1,notch:1,sbs:0,pod:0,batt:1,cells:0},
 {old:0,clash:0,newb:1,harness:1,notch:.6,sbs:1,pod:1,batt:.7,cells:0},
 {old:0,clash:0,newb:1,harness:.5,notch:.3,sbs:.2,pod:.15,batt:0,cells:1},
];
function setVis(f,step,t){ // t: 0..1 progress into step
  const v=VIS[step];
  for(const key in G){ const target=v[key]; const prev=step>0?VIS[step-1][key]:target;
    const a=prev+(target-prev)*Math.min(1,t*2.2);
    G[key].forEach(o=>{const base=(o.userData.op!==undefined?o.userData.op:.55);
      const op=key==='notch'?.85*a:base*a; o.material.opacity=op; o.material.transparent=true; o.visible=op>0.01; o.material.depthWrite=op>0.95;});
  }
  // harness growth
  if(VIS[step].harness&& (step===2)){tubeG.setDrawRange(0,Math.floor(tubeN*Math.min(1,reduce?1:t*1.6)/6)*6);} else tubeG.setDrawRange(0,tubeN);
  // plug slides in during step 4
  const dx=(step===3&&!reduce)?Math.max(0,1-t*1.8)*-45:0; plug.position.x=110.5+dx;
  // clash pulse
  clash.forEach(o=>o.scale.setScalar(1+0.12*Math.sin(f/180)));
}
// camera
let yaw=0,pitch=0,dragging=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointermove',e=>{if(!dragging)return;yaw+=(e.clientX-lx)*.006;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;});
const camState={x:145,z:-5,dist:125,az:2.35};
function lerp(a,b,t){return a+(b-a)*t}
let step=0,t0=performance.now(),playing=!reduce,camFrom=null,camStart=performance.now();
const btn=document.getElementById('play');
btn.onclick=()=>{playing=!playing;btn.textContent=playing?'Pause':'Play';btn.setAttribute('aria-pressed',String(playing));t0=performance.now()-elapsed;};
if(!playing){btn.textContent='Play';btn.setAttribute('aria-pressed','false');}
let elapsed=0;
function go(i,user){step=i;t0=performance.now();camStart=t0;elapsed=0;camFrom={...camState};
  document.querySelectorAll('#rail button').forEach((b,j)=>b.setAttribute('aria-current',j===i?'step':'false'));
  const s=STEPS[i];document.getElementById('k').textContent=s.k;document.getElementById('t').textContent=s.t;
  document.getElementById('b').innerHTML=s.b.map(x=>'<li>'+x+'</li>').join('');
  if(user&&!playing){}}
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);cam.aspect=r.width/Math.max(1,r.height);cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();go(0);
function frame(now){
  if(playing){elapsed=now-t0; if(elapsed>DUR){go((step+1)%STEPS.length);elapsed=0;}}
  const t=Math.min(1,elapsed/DUR*1.0+ (playing?0:1));
  const c=STEPS[step].cam, k=reduce?1:Math.min(1,(now-camStart)/1400), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  const from=camFrom||camState;
  camState.x=lerp(from.x,c[0],e);camState.z=lerp(from.z,c[1],e);camState.dist=lerp(from.dist,c[2],e);camState.az=lerp(from.az??c[3],c[3],e);
  const target=new THREE.Vector3(camState.x,0,-camState.z);
  const R=camState.dist*3*(cam.aspect<0.8?1.6:1), az=camState.az+yaw+(playing&&!reduce?Math.sin(now/9000)*.25:0), el=0.5+pitch;
  cam.position.set(target.x+R*Math.cos(el)*Math.sin(az),target.y+R*Math.sin(el),target.z+R*Math.cos(el)*Math.cos(az));
  cam.lookAt(target);
  setVis(now,step,playing?elapsed/DUR:1);
  document.getElementById('prog').style.width=(playing?Math.min(100,elapsed/DUR*100):100)+'%';
  renderer.render(scene,cam);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>

</body></html>
